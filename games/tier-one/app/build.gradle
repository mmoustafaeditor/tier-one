plugins { id 'com.android.application' }

// The game has one copy: the tier-one/ folder in the repo root (served at sembagames.app/tier-one).
// Its index.html and the Semba intro video are bundled into the app's assets.
def webGameSrc = rootProject.file('../../tier-one')
def webGameDir = layout.buildDirectory.dir('generated/webgame').get().asFile
def copyWebGame = tasks.register('copyWebGame', Copy) {
    from(webGameSrc) { include 'index.html', 'semba-intro.*' }
    into webGameDir
    doFirst { if (!new File(webGameSrc, 'index.html').exists()) throw new GradleException("Missing game file: ${webGameSrc}/index.html") }
}

android {
    namespace 'com.tierone.game'
    compileSdk 34

    defaultConfig {
        applicationId "com.tierone.game"
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "1.3"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
            storeType 'pkcs12'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release { minifyEnabled false }
    }

    buildFeatures {
        buildConfig true
    }
    sourceSets {
        main { assets.srcDirs += webGameDir }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.named('preBuild') { dependsOn copyWebGame }
