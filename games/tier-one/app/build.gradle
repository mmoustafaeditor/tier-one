plugins { id 'com.android.application' }

// The app bundles Tier One 3.x: tier-one/apk/index.html at the repo root, the single-file build made by `npm run build:min`
// in games/tier-one/v3/web (sembagames.app/tier-one itself serves the code-split `build:web`, which needs its assets/ folder
// and a real origin, so the app keeps the one-file build). It talks to the live API at www.sembagames.app, so play needs internet.
// The legacy intro video still comes from tier-one-classic/ (the CI check expects it; 3.x draws its intro live).
def webGameSrc = rootProject.file('../../tier-one/apk')
def introSrc = rootProject.file('../../tier-one-classic')
def webGameDir = layout.buildDirectory.dir('generated/webgame').get().asFile
def copyWebGame = tasks.register('copyWebGame', Copy) {
    from(webGameSrc) { include 'index.html' }
    from(introSrc) { include 'semba-intro.*' }
    into webGameDir
    doFirst { if (!new File(webGameSrc, 'index.html').exists()) throw new GradleException("Missing game file: ${webGameSrc}/index.html") }
}

android {
    namespace 'com.tierone.game'
    compileSdk 34

    defaultConfig {
        applicationId "com.tierone.game"
        minSdk 24
        targetSdk 34
        versionCode 17
        versionName "3.1.0"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
            storeType 'pkcs12'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release { minifyEnabled false }
    }

    buildFeatures {
        buildConfig true
    }
    sourceSets {
        main { assets.srcDirs += webGameDir }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.named('preBuild') { dependsOn copyWebGame }
