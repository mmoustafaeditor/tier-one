<style>
/* ===== Deadline Night — house theme ===== */
:root{
 --bg:#070B16; --bg2:#0B1224; --panel:#0F1729; --panel2:#16213A; --panel3:#1F2C4A; --line:#22304F; --line2:#31426A;
 --text:#F3F5FA; --muted:#8C97B4; --dim:#5F6B8A;
 --accent:#FFD23F; --accent-ink:#1A1400; --blue:#3D8BFF; --red:#FF3D55; --green:#27E08A; --gold:#FFB020; --purple:#A07BFF; --stamp:#FF3D55;
 --lift:0 1px 0 rgba(255,255,255,.05) inset,0 14px 30px -16px rgba(0,0,0,.8);
 --glow:0 0 0 1px rgba(255,210,63,.4),0 10px 30px -10px rgba(255,210,63,.55);
 --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif; --body:Barlow,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
 --gdir:90deg;
 color-scheme:dark; box-sizing:border-box;
}
:root[data-skin="stadium"]{ --bg:#05231A; --bg2:#072C21; --panel:#0A3427; --panel2:#0E4131; --panel3:#14503D; --line:#1A5C46; --line2:#23735A; --text:#EFFFF6; --muted:#98C9B3; --dim:#5E9580; --accent:#E8FF5A; --accent-ink:#0E1800; --glow:0 0 0 1px rgba(232,255,90,.4),0 10px 30px -10px rgba(232,255,90,.5); }
:root[data-skin="neon"]{ --bg:#0D0724; --bg2:#120A31; --panel:#170D3A; --panel2:#21134F; --panel3:#2C1B66; --line:#382480; --line2:#4A33A0; --text:#F6F2FF; --muted:#AB9EDB; --dim:#7465A8; --accent:#33E6FF; --accent-ink:#021219; --blue:#B36BFF; --green:#9CFF57; --red:#FF4F8B; --stamp:#FF4F8B; --glow:0 0 0 1px rgba(51,230,255,.45),0 10px 34px -8px rgba(51,230,255,.6); }
:root[data-skin="tabloid"]{ --bg:#FFF3F0; --bg2:#FFF8F6; --panel:#FFFFFF; --panel2:#FFE9E4; --panel3:#FFD8D0; --line:#F2C9C0; --line2:#E8AA9D; --text:#1C0B08; --muted:#8C5C54; --dim:#B58A82; --accent:#E3202F; --accent-ink:#FFFFFF; --blue:#1D5FD6; --green:#0F9D58; --red:#D0142A; --stamp:#D0142A; --lift:0 1px 0 #fff inset,0 10px 24px -14px rgba(120,30,20,.35); --glow:0 10px 26px -10px rgba(227,32,47,.55); color-scheme:light; }
:root[data-skin="broadsheet"]{ --bg:#F1EBDD; --bg2:#F6F1E6; --panel:#FBF8F0; --panel2:#EFE7D4; --panel3:#E4D9C0; --line:#D8CCB0; --line2:#C5B58E; --text:#1E1A12; --muted:#6F6550; --dim:#9E927A; --accent:#1E1A12; --accent-ink:#F6F1E6; --blue:#2B4C8C; --green:#2F7D4A; --red:#B3261E; --stamp:#B3261E; --lift:0 1px 0 #fff inset,0 10px 24px -16px rgba(60,45,20,.35); --glow:0 10px 26px -12px rgba(30,26,18,.5); color-scheme:light; }
html[lang="ar"]{ --display:Cairo,Tajawal,"Segoe UI",sans-serif; --body:Tajawal,Cairo,"Segoe UI",sans-serif; }
[dir="rtl"]{ --gdir:270deg; }
*{ box-sizing:inherit; }
html,body{ margin:0; min-height:100%; }
body{ background:var(--bg); color:var(--text); font:500 15px/1.45 var(--body); -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent; position:relative; }
body::before{ content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
 background:radial-gradient(70% 45% at 0% 0%,rgba(110,150,255,.20),transparent 70%),radial-gradient(70% 45% at 100% 0%,rgba(255,210,63,.13),transparent 70%),radial-gradient(90% 50% at 50% 115%,rgba(39,224,138,.12),transparent 70%),repeating-linear-gradient(90deg,rgba(255,255,255,.02) 0 46px,transparent 46px 92px),linear-gradient(180deg,#0B1226,#070B16 65%); }
:root[data-skin="stadium"] body::before{ background:radial-gradient(60% 35% at 0% 0%,rgba(255,255,220,.22),transparent 70%),radial-gradient(60% 35% at 100% 0%,rgba(255,255,220,.22),transparent 70%),radial-gradient(circle at 50% 46%,transparent 120px,rgba(255,255,255,.10) 121px,rgba(255,255,255,.10) 123px,transparent 124px),linear-gradient(rgba(255,255,255,.08),rgba(255,255,255,.08)) 50% 46%/100% 2px no-repeat,repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 64px,transparent 64px 128px),linear-gradient(180deg,#0A3A2A,#05231A); }
:root[data-skin="neon"] body::before{ background:radial-gradient(60% 40% at 10% 5%,rgba(51,230,255,.30),transparent 65%),radial-gradient(60% 45% at 95% 85%,rgba(255,79,139,.30),transparent 65%),radial-gradient(40% 30% at 70% 25%,rgba(156,255,87,.14),transparent 60%),#0D0724; }
:root[data-skin="tabloid"] body::before{ background:repeating-linear-gradient(135deg,rgba(227,32,47,.06) 0 22px,transparent 22px 44px),radial-gradient(70% 40% at 50% 0%,rgba(227,32,47,.16),transparent 70%),#FFF3F0; }
:root[data-skin="broadsheet"] body::before{ background:repeating-linear-gradient(0deg,transparent 0 27px,rgba(80,60,20,.08) 27px 28px),linear-gradient(90deg,rgba(80,60,20,.07),transparent 12%,transparent 88%,rgba(80,60,20,.07)),#F1EBDD; }
body.modal-open{ overflow:hidden; }
button{ font:inherit; color:inherit; }
button:focus-visible,.btn:focus-visible{ outline:3px solid var(--blue); outline-offset:2px; }
a{ color:var(--blue); }
.app{ max-width:520px; margin:0 auto; min-height:100vh; overflow-x:clip; }
html,body{ overflow-x:hidden; }
.screen{ padding:16px 16px 40px; }
.topbar{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:16px 16px 4px; }
.topbar + .screen{ padding-top:8px; }
@media (max-width:600px){ .screen{ padding-top:66px; } .topbar{ padding-top:66px; } }
h1,h2,h3,.disp{ font-family:var(--display); font-weight:800; font-style:italic; text-transform:uppercase; letter-spacing:-.005em; line-height:.95; margin:0; }
h1{ font-size:56px; } h2{ font-size:34px; } h3{ font-size:21px; letter-spacing:.01em; }
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3,html[lang="ar"] .disp,html[lang="ar"] .btn.primary,html[lang="ar"] .btn.danger{ font-style:normal; line-height:1.25; letter-spacing:0; }
p{ margin:0 0 10px; } .muted{ color:var(--muted); } .small{ font-size:13px; } .tiny{ font-size:12px; }
.wordmark{ font:800 italic 24px/1 var(--display); text-transform:uppercase; }
.wordmark b{ color:var(--accent-ink); background:var(--accent); padding:1px 7px; border-radius:4px; font-weight:800; }
.row{ display:flex; gap:8px; } .row > *{ flex:1; } .stack{ display:flex; flex-direction:column; gap:10px; }
.divider{ height:1px; background:var(--line); margin:18px 0; }

/* buttons */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; width:100%; min-height:48px; padding:12px 16px; border-radius:14px; border:1px solid var(--line); background:var(--panel2); color:var(--text); font:700 15px/1.2 var(--body); cursor:pointer; text-align:center; transition:transform .08s,filter .15s; }
.btn:active{ transform:scale(.97); }
.btn.primary{ background:var(--accent); color:var(--accent-ink); border-color:transparent; font:800 italic 20px/1 var(--display); text-transform:uppercase; letter-spacing:.02em; box-shadow:var(--glow); }
.btn.danger{ background:var(--red); color:#fff; border-color:transparent; font:800 italic 19px/1 var(--display); text-transform:uppercase; letter-spacing:.02em; box-shadow:0 10px 30px -10px var(--red); }
.btn.gold{ background:var(--accent); color:var(--accent-ink); border-color:transparent; }
.btn.ghost{ background:transparent; }
.btn.sm{ width:auto; min-height:36px; padding:7px 12px; font-size:13px; border-radius:10px; }
.btn.center{ justify-content:center; }
.btn[disabled]{ opacity:.4; cursor:not-allowed; box-shadow:none; }
.iconbtn{ width:42px; height:42px; flex-shrink:0; border-radius:50%; border:1px solid var(--line2); background:var(--panel2); color:var(--text); display:grid; place-items:center; font-size:17px; cursor:pointer; }

/* chips / pills */
.chip{ display:inline-flex; align-items:center; gap:5px; height:30px; padding:0 11px; border-radius:999px; background:var(--panel2); border:1px solid var(--line); font-size:13px; font-weight:700; white-space:nowrap; }
.pill{ display:inline-flex; align-items:center; gap:5px; height:28px; padding:0 10px; border-radius:999px; background:color-mix(in srgb,var(--panel3) 80%,transparent); color:var(--text); font-size:12.5px; font-weight:600; white-space:nowrap; }
.pills{ display:inline-flex; gap:2px; padding:3px; border-radius:999px; background:var(--panel); border:1px solid var(--line); }
.pills button{ border:0; background:transparent; color:var(--muted); font:700 13px var(--body); padding:6px 12px; border-radius:999px; cursor:pointer; }
.pills button.on{ background:var(--text); color:var(--bg); }

/* cards */
.card{ background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:16px; box-shadow:var(--lift); }
.card.flat{ box-shadow:none; }
.stat{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); }
.stat:last-child{ border-bottom:none; }
.stat b{ font:800 italic 22px/1 var(--display); }
.bar{ height:8px; background:var(--panel3); border-radius:99px; overflow:hidden; } .bar i{ display:block; height:100%; background:var(--accent); border-radius:99px; }
.tabs{ display:flex; gap:4px; padding:4px; background:var(--panel); border:1px solid var(--line); border-radius:14px; margin:0 0 12px; }
.tabs button{ flex:1; border:0; background:transparent; color:var(--muted); padding:10px 6px; border-radius:10px; font:700 14px var(--body); cursor:pointer; }
.tabs button.on{ background:var(--panel3); color:var(--text); }

/* ===== HOME ===== */
.homebar{ display:flex; justify-content:space-between; align-items:center; }
.hero{ padding:22px 2px 16px; }
.livebug{ display:inline-flex; align-items:center; gap:8px; height:28px; padding:0 11px 0 9px; border-radius:6px; background:var(--red); color:#fff; font:800 italic 14px/1 var(--display); letter-spacing:.08em; text-transform:uppercase; }
html[lang="ar"] .livebug{ font-style:normal; letter-spacing:0; }
.livebug i{ width:8px; height:8px; border-radius:50%; background:#fff; animation:blip 1.2s infinite; }
@keyframes blip{ 50%{ opacity:.2; } }
.logo{ display:flex; align-items:flex-end; gap:10px; margin-top:14px; font:800 italic clamp(54px,17vw,88px)/.8 "Barlow Condensed",Impact,sans-serif; text-transform:uppercase; letter-spacing:-.02em; direction:ltr; }
.logo span,.logo b{ white-space:nowrap; } .logo b{ font-weight:800; background:var(--accent); color:var(--accent-ink); padding:10px 22px 4px 16px; clip-path:polygon(7% 0,100% 0,93% 100%,0 100%); box-shadow:var(--glow); }
.tagline{ font-size:18px; line-height:1.35; color:var(--muted); margin-top:16px; max-width:30ch; }
.nstack{ position:relative; height:96px; margin:4px 0 18px; }
.notif{ position:absolute; inset-inline:0; top:0; display:flex; gap:12px; align-items:center; min-height:68px; padding:12px 14px; border-radius:18px; background:var(--panel2); border:1px solid var(--line2); box-shadow:0 16px 30px -16px rgba(0,0,0,.8); transition:transform .55s cubic-bezier(.2,.9,.3,1),filter .55s; transform-origin:50% 0; }
.notif .ic{ width:40px; height:40px; border-radius:12px; background:var(--panel3); display:grid; place-items:center; font-size:22px; flex-shrink:0; }
.notif .tx{ flex:1; min-width:0; }
.notif b{ display:flex; justify-content:space-between; gap:8px; font-size:12px; color:var(--muted); font-weight:700; }
.notif b em{ font-style:normal; font-weight:500; color:var(--dim); }
.notif .m{ display:block; font-size:14.5px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.notif.p0{ z-index:3; transform:none; }
.notif.p1{ z-index:2; transform:translateY(13px) scale(.95); filter:brightness(.72); }
.notif.p2{ z-index:1; transform:translateY(26px) scale(.9); filter:brightness(.5); }
.resume{ display:flex; align-items:center; gap:10px; width:100%; padding:14px 16px; margin-bottom:10px; border-radius:16px; border:1px solid color-mix(in srgb,var(--accent) 60%,var(--line)); background:color-mix(in srgb,var(--accent) 12%,var(--panel)); color:var(--text); font:700 15px var(--body); cursor:pointer; text-align:start; }
.resume .dot{ width:10px; height:10px; border-radius:50%; background:var(--accent); box-shadow:0 0 10px var(--accent); animation:blip 1.2s infinite; flex-shrink:0; }
.tile{ position:relative; display:block; width:100%; text-align:start; border:1px solid var(--line); border-radius:22px; padding:18px; background:var(--panel); color:var(--text); cursor:pointer; overflow:hidden; box-shadow:var(--lift); transition:transform .1s; margin-bottom:10px; }
.tile:active{ transform:scale(.985); }
.tile.daily{ background:radial-gradient(110% 90% at 100% 0%,color-mix(in srgb,var(--accent) 24%,transparent),transparent 55%),linear-gradient(160deg,var(--panel2),var(--panel)); border-color:color-mix(in srgb,var(--accent) 45%,var(--line)); }
.tile .num{ position:absolute; inset-inline-end:14px; bottom:-30px; font:800 italic 140px/1 "Barlow Condensed",Impact,sans-serif; color:var(--text); opacity:.07; pointer-events:none; }
.tile .t-title{ display:block; position:relative; font:800 italic 34px/.95 var(--display); text-transform:uppercase; }
html[lang="ar"] .tile .t-title{ font-style:normal; line-height:1.25; }
.tile .t-sub{ display:block; position:relative; color:var(--muted); margin-top:8px; font-size:15px; max-width:34ch; }
.tile .t-foot{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:16px; position:relative; }
.tile .meta{ display:flex; flex-wrap:wrap; gap:6px; }
.tile .cta{ display:inline-flex; align-items:center; justify-content:center; min-width:104px; height:48px; padding:0 20px; border-radius:13px; background:var(--accent); color:var(--accent-ink); font:800 italic 21px/1 var(--display); text-transform:uppercase; box-shadow:var(--glow); flex-shrink:0; }
html[lang="ar"] .tile .cta{ font-style:normal; }
.tile .cta.done{ background:var(--panel3); color:var(--muted); box-shadow:none; }
.tile .donerow{ display:block; font-size:24px; letter-spacing:2px; margin-top:10px; position:relative; }
.ctop{ display:flex; align-items:center; gap:14px; }
.ctop .cinfo{ flex:1; min-width:0; }
.ctop .chev{ font-size:28px; color:var(--muted); } [dir="rtl"] .ctop .chev{ transform:scaleX(-1); }
.ring{ --p:0; width:58px; height:58px; border-radius:50%; background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--panel3) 0); display:grid; place-items:center; flex-shrink:0; }
.ring b{ width:46px; height:46px; border-radius:50%; background:var(--panel); display:grid; place-items:center; font:800 italic 24px/1 "Barlow Condensed",Impact,sans-serif; }
.quick{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.quick button{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; min-height:84px; padding:12px 6px; border-radius:16px; border:1px solid var(--line); background:var(--panel); color:var(--text); font:700 13px/1.2 var(--body); cursor:pointer; text-align:center; }
.quick button span{ font-size:24px; }
.instant .reveal,.instant .tierpop,.instant .stamp{ animation:none !important; opacity:1 !important; }
.archlink{ display:flex; align-items:center; justify-content:space-between; width:100%; margin:-2px 0 12px; padding:13px 16px; border-radius:14px; border:1px solid var(--line); background:var(--panel); color:var(--text); font:700 14.5px var(--body); cursor:pointer; text-align:start; }
.archlink .chev{ color:var(--muted); font-size:20px; } [dir="rtl"] .archlink .chev,[dir="rtl"] .archrow .chev{ transform:scaleX(-1); }
.archstats{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
.archstats div{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px 6px; text-align:center; display:flex; flex-direction:column; gap:4px; }
.archstats b{ font:800 italic 24px/1 "Barlow Condensed",Impact,sans-serif; } .archstats span{ font-size:11.5px; color:var(--muted); font-weight:600; }
.archrow{ display:flex; align-items:center; gap:12px; width:100%; padding:12px 14px; border-radius:16px; border:1px solid var(--line); background:var(--panel); color:var(--text); cursor:pointer; text-align:start; box-shadow:var(--lift); }
.archrow:active{ transform:scale(.985); }
.archrow .an{ font:800 italic 22px/1 "Barlow Condensed",Impact,sans-serif; color:var(--muted); min-width:38px; }
.archrow .ai{ flex:1; min-width:0; display:flex; flex-direction:column; gap:4px; } .archrow .ai b{ font-size:14px; } .archrow .ar{ font-size:15px; letter-spacing:1px; white-space:nowrap; overflow:hidden; }
.archrow .at{ display:flex; flex-direction:column; align-items:flex-end; gap:4px; font-size:12px; color:var(--muted); } .archrow .chev{ color:var(--muted); font-size:22px; }
.tierchip{ font:800 italic 13px/1 var(--display); text-transform:uppercase; padding:4px 7px; border-radius:6px; background:var(--panel3); color:var(--text); white-space:nowrap; } .tierchip.t1{ background:var(--accent); color:var(--accent-ink); } .tierchip.clown{ background:var(--red); color:#fff; }
html[lang="ar"] .tierchip{ font-style:normal; }
.studiolink{ display:inline-flex; align-items:center; gap:6px; height:34px; padding:0 12px; border-radius:999px; border:1px solid var(--line); background:var(--panel); color:var(--text); font:700 13px var(--body); text-decoration:none; }
.foot{ text-align:center; color:var(--dim); font-size:12px; padding:22px 12px 0; }

/* ===== GAME ===== */
.gamehead{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
.t-mode{ display:block; font-size:13px; color:var(--muted); font-weight:700; margin-bottom:4px; }
.dayttl{ font-size:46px; } .dayttl.dd{ color:var(--red); }
.daytrack{ display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin:14px 0; }
.daytrack i{ height:6px; border-radius:99px; background:var(--panel3); }
.daytrack i.past{ background:var(--muted); }
.daytrack i.now{ background:var(--accent); box-shadow:0 0 12px var(--accent); }
.daytrack i.dd{ background:color-mix(in srgb,var(--red) 40%,var(--panel3)); }
.daytrack i.dd.now{ background:var(--red); box-shadow:0 0 12px var(--red); }
.ticker{ margin:0 -16px 14px; overflow:hidden; white-space:nowrap; background:var(--accent); color:var(--accent-ink); font:700 13px var(--body); padding:8px 0; }
.ticker.dd{ background:var(--red); color:#fff; }
.ticker .track{ display:inline-block; padding-inline-start:100%; animation:ticker 30s linear infinite; }
[dir="rtl"] .ticker .track{ animation-name:tickerRtl; }
.ticker b{ background:var(--accent-ink); color:var(--accent); padding:2px 7px; border-radius:4px; margin-inline-end:8px; font:800 italic 13px var(--display); letter-spacing:.05em; }
.ticker.dd b{ background:#fff; color:var(--red); }
@keyframes ticker{ to{ transform:translateX(-100%); } } @keyframes tickerRtl{ to{ transform:translateX(100%); } }
.saga{ display:flex; align-items:center; gap:12px; width:100%; text-align:start; padding:12px; border-radius:18px; border:1px solid var(--line); background:var(--panel); color:var(--text); cursor:pointer; box-shadow:var(--lift); transition:transform .08s; }
.saga:active{ transform:scale(.985); }
.saga .who{ flex:1; min-width:0; }
.saga .who b{ display:block; font:800 italic 21px/1.05 var(--display); text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
html[lang="ar"] .saga .who b{ font-style:normal; line-height:1.4; }
.route{ display:flex; flex-wrap:wrap; align-items:center; gap:2px 6px; font-size:13px; color:var(--muted); margin-top:3px; }
.route i{ width:10px; height:10px; border-radius:3px; flex-shrink:0; box-shadow:0 0 0 1px rgba(255,255,255,.25); }
.route .to{ color:var(--text); font-weight:700; overflow:hidden; text-overflow:ellipsis; }

.shake{ animation:shake .5s; } @keyframes shake{ 10%,90%{ transform:translateX(-2px);} 20%,80%{ transform:translateX(4px);} 30%,50%,70%{ transform:translateX(-6px);} 40%,60%{ transform:translateX(6px);} }

/* ===== Motion v2 ===== */
:root{ --ease-out:cubic-bezier(.16,1,.3,1); --ease-spring:cubic-bezier(.34,1.56,.64,1); --ease-io:cubic-bezier(.7,0,.2,1); }
/* screen entrance: children rise in sequence */
.enter .topbar,.enter .screen > *,.enter .stack > *,.enter #sagaList > *,.enter .quick > *{ animation:enterUp .6s var(--ease-out) both; }
.enter .screen > *:nth-child(1),.enter .stack > *:nth-child(1),.enter #sagaList > *:nth-child(1),.enter .quick > *:nth-child(1){ animation-delay:.02s; }
.enter .screen > *:nth-child(2),.enter .stack > *:nth-child(2),.enter #sagaList > *:nth-child(2),.enter .quick > *:nth-child(2){ animation-delay:.07s; }
.enter .screen > *:nth-child(3),.enter .stack > *:nth-child(3),.enter #sagaList > *:nth-child(3),.enter .quick > *:nth-child(3){ animation-delay:.12s; }
.enter .screen > *:nth-child(4),.enter .stack > *:nth-child(4),.enter #sagaList > *:nth-child(4){ animation-delay:.17s; }
.enter .screen > *:nth-child(5),.enter .stack > *:nth-child(5),.enter #sagaList > *:nth-child(5){ animation-delay:.22s; }
.enter .screen > *:nth-child(6),.enter .stack > *:nth-child(6),.enter #sagaList > *:nth-child(6){ animation-delay:.27s; }
.enter .screen > *:nth-child(7),.enter .stack > *:nth-child(7),.enter #sagaList > *:nth-child(7){ animation-delay:.32s; }
.enter .screen > *:nth-child(n+8),.enter .stack > *:nth-child(n+8),.enter #sagaList > *:nth-child(n+8){ animation-delay:.37s; }
@keyframes enterUp{ from{ opacity:0; transform:translateY(22px) scale(.985); filter:blur(3px); } to{ opacity:1; transform:none; filter:none; } }

/* home hero: logo slams in */
.home .livebug{ animation:popIn .5s var(--ease-spring) .05s both; }
.home .logo span{ animation:logoIn .7s var(--ease-out) .1s both; }
.home .logo b{ animation:logoSlam .75s var(--ease-spring) .28s both; }
.home .tagline{ animation:enterUp .7s var(--ease-out) .45s both; }
@keyframes logoIn{ from{ opacity:0; transform:translateX(-40px) skewX(12deg); filter:blur(6px); } to{ opacity:1; transform:none; filter:none; } }
@keyframes logoSlam{ 0%{ opacity:0; transform:scale(2.4) rotate(-6deg); filter:blur(8px); } 60%{ opacity:1; transform:scale(.94) rotate(1deg); filter:none; } 100%{ transform:none; } }
@keyframes popIn{ from{ opacity:0; transform:scale(.6); } to{ opacity:1; transform:none; } }
.tile.daily{ isolation:isolate; }
.tile.daily::after{ content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; z-index:1; background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.12) 50%,transparent 65%) no-repeat; background-size:260% 100%; animation:sheen 5.5s ease-in-out 1.2s infinite; }
@keyframes sheen{ 0%{ background-position:130% 0; } 30%,100%{ background-position:-130% 0; } }
.tile .cta:not(.done){ animation:ctaPulse 2.8s ease-in-out 1.6s infinite; }
@keyframes ctaPulse{ 0%,100%{ box-shadow:var(--glow); } 50%{ box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 22%,transparent),var(--glow); } }
.btn.primary,.hud .btn{ position:relative; overflow:hidden; }
.btn.primary::after{ content:""; position:absolute; inset:0; background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%) no-repeat; background-size:250% 100%; background-position:150% 0; transition:background-position .7s var(--ease-out); pointer-events:none; }
.btn.primary:hover::after,.btn.primary:focus-visible::after{ background-position:-60% 0; }
.btn,.saga,.tile,.srcbtn,.archrow,.quick button{ transition:transform .18s var(--ease-spring),box-shadow .25s,filter .2s; }
.saga:active,.tile:active,.archrow:active{ transform:scale(.975); }

/* bottom sheets: spring in, slide out */
.overlay{ animation:ovIn .3s ease-out both; }
.modal{ animation:sheetSpring .55s var(--ease-spring) both; }
@keyframes ovIn{ from{ background:rgba(3,6,14,0); backdrop-filter:blur(0); -webkit-backdrop-filter:blur(0); } }
@keyframes sheetSpring{ from{ transform:translateY(105%); } to{ transform:none; } }
.overlay.closing{ animation:ovOut .24s ease-in forwards; pointer-events:none; }
.overlay.closing .modal{ animation:sheetOut .24s var(--ease-io) forwards; }
@keyframes ovOut{ to{ background:rgba(3,6,14,0); backdrop-filter:blur(0); -webkit-backdrop-filter:blur(0); } }
@keyframes sheetOut{ to{ transform:translateY(100%); } }
.overlay.still,.overlay.still .modal{ animation:none; }
.srcgrid > *,.srclist > *{ animation:enterUp .45s var(--ease-out) both; } .srclist > *:nth-child(2){ animation-delay:.04s; } .srclist > *:nth-child(3){ animation-delay:.08s; } .srclist > *:nth-child(4){ animation-delay:.12s; } .srclist > *:nth-child(5){ animation-delay:.16s; } .srclist > *:nth-child(6){ animation-delay:.2s; } .overlay.still .srclist > *{ animation:none; } .srcgrid > *:nth-child(2){ animation-delay:.04s; } .srcgrid > *:nth-child(3){ animation-delay:.08s; } .srcgrid > *:nth-child(4){ animation-delay:.12s; } .srcgrid > *:nth-child(5){ animation-delay:.16s; } .srcgrid > *:nth-child(6){ animation-delay:.2s; }
.overlay.still .srcgrid > *{ animation:none; }
.rep .bars i.on{ animation:barFill .5s var(--ease-out) both; } .rep .bars i:nth-child(2).on{ animation-delay:.08s; } .rep .bars i:nth-child(3).on{ animation-delay:.16s; }
@keyframes barFill{ from{ transform:scaleX(0); transform-origin:left; } to{ transform:none; } }
[dir="rtl"] .rep .bars i.on{ transform-origin:right; }

/* day stinger: full-contrast text, never faded mid-screen */
.stinger{ position:fixed; inset:0; z-index:70; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; pointer-events:none; overflow:hidden; text-align:center; }
.stinger .st-scrim{ position:absolute; inset:0; background:rgba(3,6,14,.9); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); animation:stScrim .3s ease-out both; }
.stinger .st-rays{ position:absolute; left:50%; top:50%; width:170vmax; height:170vmax; margin:-85vmax 0 0 -85vmax; background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--accent) 10%,transparent) 0 6deg,transparent 6deg 18deg); mask:radial-gradient(circle,#000 0,transparent 55%); -webkit-mask:radial-gradient(circle,#000 0,transparent 55%); animation:stRays 2s linear both; }
.stinger .st-band{ position:relative; width:128%; padding:16px 0 12px; background:var(--accent); color:var(--accent-ink); transform:rotate(-5deg); box-shadow:0 0 60px color-mix(in srgb,var(--accent) 55%,transparent); animation:stWipe .5s var(--ease-io) both; }
.stinger .st-big{ font:800 italic clamp(44px,14vw,82px)/1 var(--display); text-transform:uppercase; letter-spacing:-.01em; animation:stText .6s var(--ease-out) .14s both; }
html[lang="ar"] .stinger .st-big{ font-style:normal; line-height:1.35; }
.stinger .st-sub{ position:relative; max-width:30ch; padding:0 20px; color:#fff; font:700 17px/1.4 var(--body); text-shadow:0 2px 12px rgba(0,0,0,.6); animation:enterUp .55s var(--ease-out) .32s both; }
.stinger .st-track{ position:relative; display:grid; grid-template-columns:repeat(7,26px); gap:6px; }
.stinger .st-track i{ height:6px; border-radius:99px; background:rgba(255,255,255,.18); animation:popIn .35s var(--ease-spring) calc(.3s + var(--i)*.05s) both; }
.stinger .st-track i.past{ background:rgba(255,255,255,.7); } .stinger .st-track i.dd{ background:color-mix(in srgb,var(--red) 55%,transparent); }
.stinger .st-track i.now{ background:var(--accent); box-shadow:0 0 14px var(--accent); animation:popIn .35s var(--ease-spring) calc(.3s + var(--i)*.05s) both,nowGlow .9s ease-in-out .9s infinite alternate; }
.stinger.red .st-band{ background:var(--red); color:#fff; box-shadow:0 0 70px color-mix(in srgb,var(--red) 70%,transparent); }
.stinger.red .st-rays{ background:repeating-conic-gradient(from 0deg,rgba(255,61,85,.16) 0 6deg,transparent 6deg 18deg); }
.stinger.red .st-big{ animation:stText .6s var(--ease-out) .14s both,glitch .5s steps(2) .75s 2; }
.stinger.red .st-track i.now{ background:var(--red); box-shadow:0 0 14px var(--red); }
.stinger.out .st-band{ animation:stWipeOut .45s var(--ease-io) forwards; }
.stinger.out .st-sub,.stinger.out .st-track{ animation:fadeUpOut .35s ease-in forwards; }
.stinger.out .st-scrim,.stinger.out .st-rays{ animation:stScrimOut .5s ease-in .1s forwards; }
@keyframes stScrim{ from{ opacity:0; } }
@keyframes stScrimOut{ to{ opacity:0; } }
@keyframes stRays{ from{ transform:rotate(0) scale(.6); opacity:0; } 30%{ opacity:1; } to{ transform:rotate(40deg) scale(1); opacity:1; } }
@keyframes stWipe{ from{ clip-path:polygon(0 0,0 0,0 100%,0 100%); } to{ clip-path:polygon(0 0,100% 0,100% 100%,0 100%); } }
@keyframes stWipeOut{ from{ clip-path:polygon(0 0,100% 0,100% 100%,0 100%); } to{ clip-path:polygon(100% 0,100% 0,100% 100%,100% 100%); } }
@keyframes stText{ from{ opacity:0; transform:translateX(-18%) skewX(-14deg); filter:blur(6px); } to{ opacity:1; transform:none; filter:none; } }
@keyframes fadeUpOut{ to{ opacity:0; transform:translateY(-12px); } }
@keyframes nowGlow{ to{ box-shadow:0 0 22px 2px var(--accent); } }
@keyframes glitch{ 0%{ transform:translate(2px,-1px); text-shadow:-3px 0 #fff4,3px 0 #0006; } 50%{ transform:translate(-2px,1px); text-shadow:3px 0 #fff4,-3px 0 #0006; } 100%{ transform:none; text-shadow:none; } }

/* results: sunburst behind the tier */

.hero-tier::before{ content:""; position:absolute; left:50%; top:46%; width:520px; height:520px; margin:-260px 0 0 -260px; z-index:-1; pointer-events:none; background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--accent) 16%,transparent) 0 7deg,transparent 7deg 20deg); mask:radial-gradient(circle,#000 0,transparent 62%); -webkit-mask:radial-gradient(circle,#000 0,transparent 62%); animation:raysIn .9s var(--ease-out) var(--td,0s) both,raysSpin 40s linear var(--td,0s) infinite; }

<script>
(function(){
 var b=document.getElementById('boot'); if(!b) return;
 function gone(){ try{ window.dispatchEvent(new Event('sembaboot')); }catch(e){} }
 if(/[?&]purchase=/.test(location.search)||/^#(privacy|terms|contact)$/.test(location.hash)){ b.remove(); window.__bootDone=true; return; }
 var base=location.protocol==='file:'?'':'/tier-one/';
 var v=b.querySelector('video'), img=b.querySelector('.bp'), start=b.querySelector('.bstart'), done=false, started=false;
 var soundOn=true; try{ var sv=JSON.parse(localStorage.getItem('tierone_v1')||'{}'); if(sv.settings&&sv.settings.sound===false) soundOn=false; }catch(e){}
 img.src=base+'semba-intro.jpg';
 function end(){ if(done) return; done=true; window.__bootDone=true; b.classList.add('out'); setTimeout(function(){ try{ v.pause(); }catch(e){} b.remove(); },900); gone(); }
 function still(ms){ if(done||b.classList.contains('still')) return; start.hidden=true; b.classList.remove('playing','gate'); b.classList.add('still'); b.style.setProperty('--bd',(ms/1000)+'s'); setTimeout(end,ms); }
 function began(){ if(started) return; started=true; start.hidden=true; b.classList.remove('gate'); setTimeout(end,((v.duration&&isFinite(v.duration))?v.duration:4.2)*1000+1500); }
 var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
 if(reduce||!v.canPlayType){ still(1600); return; }
 v.src=base+(v.canPlayType('video/webm; codecs="vp9, opus"')?'semba-intro.webm':'semba-intro.mp4');
 v.addEventListener('playing',function(){ if(!b.classList.contains('still')){ b.classList.add('playing'); began(); } });
 v.addEventListener('ended',end);
 v.addEventListener('error',function(){ still(2200); });
 // Browsers only allow sound after a tap. If autoplay with sound is refused, wait for one tap instead of playing silently.
 function gate(){ if(done) return; b.classList.add('gate'); start.hidden=false; }
 start.addEventListener('click',function(e){ e.stopPropagation(); start.hidden=true; v.muted=!soundOn; try{ v.currentTime=0; }catch(x){} var q; try{ q=v.play(); }catch(x){ still(2200); return; } if(q&&q.catch) q.catch(function(){ still(2200); }); });
 b.addEventListener('click',function(){ if(!start.hidden) start.click(); });
 v.muted=!soundOn; var p; try{ p=v.play(); }catch(e){ gate(); }
 if(p&&p.catch) p.catch(function(){ gate(); });
 setTimeout(function(){ if(!started&&!done&&start.hidden&&!b.classList.contains('still')) gate(); },1800);
})();

 howto:{title:'How to play',cards:[['The window','8 real players, 8 rumored moves. Every saga has a hidden truth: the deal happens, he leaves somewhere else, it collapses, or it was never real.'],['10 contacts',"Each day you get 10 contacts to spend. Every source shows a reliability bar. High (Physio, Airport spotter) costs 3 contacts, Medium (Agent, Kitman) costs 2, Low (Barber, Rival newsroom leak) costs 1. Even the best ones lie sometimes."],['Player types','★★★ Superstars count ×1.5 points and ×2 followers, ★★ Stars ×1.2 and ×1.4, ★ Squad players ×1. Right or wrong: big names, big swings.'],['Post your call','Pick what happens and how loud you say it. Quiet call: +10 right, −5 wrong. Loud "Confirmed" call: +40 right, −35 wrong. Earlier calls earn a bonus. Beat every rival to a correct call and it\'s an exclusive: +15. Tier 1 now takes 375+ pts.'],['Changing your mind',"You can delete a posted call and re-call it, but it's public: followers drop, the Tabloid mocks you, and the new call scores half with no exclusive."],['Deadline Day',"Day 7 is a 60-second timer with 3 contacts. Whatever you haven't called gets ⚪ and zero points. Then everything is announced, the replies roll in, and you get your tier."],['Daily vs Career','The daily window is identical for everyone, no gear, no boosts — just skill and nerve. Career is your own long game: earn dollars, buy gear, bribe sources, unlock catchphrases, grow your followers.'],['Rivals',"The Tabloid posts early and loud and is wrong more than half the time. The ITK account is a coin flip. The Club Insider posts late and is nearly always right — by then it's not an exclusive."]]},

 howto:{title:'Cómo se juega',cards:[['El mercado','8 jugadores reales, 8 rumores. Cada culebrón esconde una verdad: se hace, se va a otro sitio, se cae o nunca fue real.'],['10 contactos','Cada día tienes 10 contactos. Cada fuente muestra una barra de fiabilidad. Alta (Fisio, Vigía del aeropuerto) cuesta 3 contactos, Media (Agente, Utillero) cuesta 2, Baja (Barbero, Topo de la redacción rival) cuesta 1. Hasta las mejores mienten a veces.'],['Tipos de jugador','★★★ Las superestrellas cuentan ×1,5 puntos y ×2 seguidores, ★★ las estrellas ×1,2 y ×1,4, ★ los de plantilla ×1. Aciertes o falles: nombres grandes, golpes grandes.'],['Publica tu apuesta','Elige qué pasa y con cuánta fuerza lo dices. Apuesta suave: +10 acierto, −5 fallo. Apuesta "Confirmado" a gritos: +40 acierto, −35 fallo. Apostar antes suma bonus. Si le ganas a todos los rivales con un acierto, es exclusiva: +15. Tier 1 ahora exige 375+ pts.'],['Cambiar de opinión','Puedes borrar una apuesta publicada y volver a apostar, pero es público: pierdes seguidores, el Tabloide se burla y la nueva apuesta puntúa la mitad sin exclusiva.'],['Día límite','El día 7 es un temporizador de 60 segundos con solo 3 contactos. Lo que no hayas apostado recibe ⚪ y cero puntos. Luego se anuncia todo, llegan las respuestas y recibes tu tier.'],['Diario vs Carrera','El mercado diario es idéntico para todos, sin equipo ni mejoras: solo habilidad y valor. Carrera es tu partida larga: gana dólares, compra equipo, soborna fuentes, desbloquea coletillas, suma seguidores.'],['Rivales','El Tabloide publica pronto y a gritos, y falla más de la mitad de las veces. La cuenta ITK es cara o cruz. El Insider del club publica tarde y casi siempre acierta… pero para entonces ya no es exclusiva.']]},

function renderArchive(){

function startMode(mode){
 stopTimer();
 if(mode==='daily'){ const k=todayKey(); if(save.daily.history[k]&&!CONFIG.DAILY_REPLAY){ openDaily(k); return; } if(save.inProgress&&save.inProgress.mode==='daily'&&save.inProgress.seed==='daily-'+k){ game=save.inProgress; go('window'); return; } newGame('daily','daily-'+k); }
 else if(mode==='career') newGame('career','career-'+Date.now()+'-'+Math.floor(Math.random()*1e6));
 else newGame('practice','practice-'+Date.now()+'-'+Math.floor(Math.random()*1e6));
 Analytics.track('level_start',{level_name:mode}); beep('open'); splash(t('sys.open').split('.')[0],t('win.day',{d:1}),false); go('window');
}

 if(a==='buyEquip'){ const eq=EQUIP.find(x=>x.key===v); const cc=C(); if(cc.credits>=eq.cost&&!cc.equip.includes(v)&&levelInfo(cc.xp).n>=(eq.lvl||1)){ cc.credits-=eq.cost; cc.equip.push(v); persist(); Analytics.track('spend_virtual_currency',{value:eq.cost,virtual_currency_name:'credits',item_name:v}); beep('ding'); toast(t('toast.bought',{x:t('equip.'+v+'.name')})); render(); } return; }

// ----- save codes (move progress between devices) -----
function b64enc(s){ const u=new TextEncoder().encode(s); let b=''; for(let i=0;i<u.length;i++) b+=String.fromCharCode(u[i]); return btoa(b); }
function b64dec(b){ const bin=atob(b); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return new TextDecoder().decode(u); }
function codeHash(s){ let h=5381; for(let i=0;i<s.length;i++) h=(Math.imul(h,33)^s.charCodeAt(i))>>>0; return h.toString(36); }
function exportSave(){ try{ const b=b64enc(JSON.stringify(save)); return 'T1.'+b+'.'+codeHash(b); }catch(e){ return ''; } }
function importSave(code){ try{ const m=String(code||'').trim().match(/^T1\.([A-Za-z0-9+\/=]+)\.([a-z0-9]+)$/); if(!m||codeHash(m[1])!==m[2]) return false;
 const obj=JSON.parse(b64dec(m[1])); if(!obj||typeof obj!=='object'||!obj.career||!obj.settings) return false;
 const keepConsent=save.consent; let stored=false; try{ localStorage.setItem(SAVE_KEY,JSON.stringify(obj)); stored=true; }catch(e){}
 if(stored) loadSave(); else { save=Object.assign(freshSave(),obj); lang=save.settings.lang||lang; }
 if(!save.consent) save.consent=keepConsent; game=null; stopTimer(); persist(); Analytics.track('save_import',{}); return true; }catch(e){ return false; } }
