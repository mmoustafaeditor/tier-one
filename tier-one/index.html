<style>
/* ===== Deadline Night — house theme ===== */
:root{
 --bg:#070B16; --bg2:#0B1224; --panel:#0F1729; --panel2:#16213A; --panel3:#1F2C4A; --line:#22304F; --line2:#31426A;
 --text:#F3F5FA; --muted:#8C97B4; --dim:#5F6B8A;
 --accent:#FFD23F; --accent-ink:#1A1400; --blue:#3D8BFF; --red:#FF3D55; --green:#27E08A; --gold:#FFB020; --purple:#A07BFF; --stamp:#FF3D55;
 --lift:0 1px 0 rgba(255,255,255,.05) inset,0 14px 30px -16px rgba(0,0,0,.8);
 --glow:0 0 0 1px rgba(255,210,63,.4),0 10px 30px -10px rgba(255,210,63,.55);
 --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif; --body:Barlow,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
 --gdir:90deg;
 color-scheme:dark; box-sizing:border-box;
}
:root[data-skin="stadium"]{ --bg:#05231A; --bg2:#072C21; --panel:#0A3427; --panel2:#0E4131; --panel3:#14503D; --line:#1A5C46; --line2:#23735A; --text:#EFFFF6; --muted:#98C9B3; --dim:#5E9580; --accent:#E8FF5A; --accent-ink:#0E1800; --glow:0 0 0 1px rgba(232,255,90,.4),0 10px 30px -10px rgba(232,255,90,.5); }
:root[data-skin="neon"]{ --bg:#0D0724; --bg2:#120A31; --panel:#170D3A; --panel2:#21134F; --panel3:#2C1B66; --line:#382480; --line2:#4A33A0; --text:#F6F2FF; --muted:#AB9EDB; --dim:#7465A8; --accent:#33E6FF; --accent-ink:#021219; --blue:#B36BFF; --green:#9CFF57; --red:#FF4F8B; --stamp:#FF4F8B; --glow:0 0 0 1px rgba(51,230,255,.45),0 10px 34px -8px rgba(51,230,255,.6); }
:root[data-skin="tabloid"]{ --bg:#FFF3F0; --bg2:#FFF8F6; --panel:#FFFFFF; --panel2:#FFE9E4; --panel3:#FFD8D0; --line:#F2C9C0; --line2:#E8AA9D; --text:#1C0B08; --muted:#8C5C54; --dim:#B58A82; --accent:#E3202F; --accent-ink:#FFFFFF; --blue:#1D5FD6; --green:#0F9D58; --red:#D0142A; --stamp:#D0142A; --lift:0 1px 0 #fff inset,0 10px 24px -14px rgba(120,30,20,.35); --glow:0 10px 26px -10px rgba(227,32,47,.55); color-scheme:light; }
:root[data-skin="broadsheet"]{ --bg:#F1EBDD; --bg2:#F6F1E6; --panel:#FBF8F0; --panel2:#EFE7D4; --panel3:#E4D9C0; --line:#D8CCB0; --line2:#C5B58E; --text:#1E1A12; --muted:#6F6550; --dim:#9E927A; --accent:#1E1A12; --accent-ink:#F6F1E6; --blue:#2B4C8C; --green:#2F7D4A; --red:#B3261E; --stamp:#B3261E; --lift:0 1px 0 #fff inset,0 10px 24px -16px rgba(60,45,20,.35); --glow:0 10px 26px -12px rgba(30,26,18,.5); color-scheme:light; }
html[lang="ar"]{ --display:Cairo,Tajawal,"Segoe UI",sans-serif; --body:Tajawal,Cairo,"Segoe UI",sans-serif; }
[dir="rtl"]{ --gdir:270deg; }
*{ box-sizing:inherit; }
html,body{ margin:0; min-height:100%; }
body{ background:var(--bg); color:var(--text); font:500 15px/1.45 var(--body); -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent; position:relative; }
body::before{ content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
 background:radial-gradient(70% 45% at 0% 0%,rgba(110,150,255,.20),transparent 70%),radial-gradient(70% 45% at 100% 0%,rgba(255,210,63,.13),transparent 70%),radial-gradient(90% 50% at 50% 115%,rgba(39,224,138,.12),transparent 70%),repeating-linear-gradient(90deg,rgba(255,255,255,.02) 0 46px,transparent 46px 92px),linear-gradient(180deg,#0B1226,#070B16 65%); }
:root[data-skin="stadium"] body::before{ background:radial-gradient(60% 35% at 0% 0%,rgba(255,255,220,.22),transparent 70%),radial-gradient(60% 35% at 100% 0%,rgba(255,255,220,.22),transparent 70%),radial-gradient(circle at 50% 46%,transparent 120px,rgba(255,255,255,.10) 121px,rgba(255,255,255,.10) 123px,transparent 124px),linear-gradient(rgba(255,255,255,.08),rgba(255,255,255,.08)) 50% 46%/100% 2px no-repeat,repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 64px,transparent 64px 128px),linear-gradient(180deg,#0A3A2A,#05231A); }
:root[data-skin="neon"] body::before{ background:radial-gradient(60% 40% at 10% 5%,rgba(51,230,255,.30),transparent 65%),radial-gradient(60% 45% at 95% 85%,rgba(255,79,139,.30),transparent 65%),radial-gradient(40% 30% at 70% 25%,rgba(156,255,87,.14),transparent 60%),#0D0724; }
:root[data-skin="tabloid"] body::before{ background:repeating-linear-gradient(135deg,rgba(227,32,47,.06) 0 22px,transparent 22px 44px),radial-gradient(70% 40% at 50% 0%,rgba(227,32,47,.16),transparent 70%),#FFF3F0; }
:root[data-skin="broadsheet"] body::before{ background:repeating-linear-gradient(0deg,transparent 0 27px,rgba(80,60,20,.08) 27px 28px),linear-gradient(90deg,rgba(80,60,20,.07),transparent 12%,transparent 88%,rgba(80,60,20,.07)),#F1EBDD; }
body.modal-open{ overflow:hidden; }
button{ font:inherit; color:inherit; }
button:focus-visible,.btn:focus-visible{ outline:3px solid var(--blue); outline-offset:2px; }
a{ color:var(--blue); }
.app{ max-width:520px; margin:0 auto; min-height:100vh; overflow-x:clip; }
html,body{ overflow-x:hidden; }
.screen{ padding:16px 16px 40px; }
.topbar{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:16px 16px 4px; }
.topbar + .screen{ padding-top:8px; }
@media (max-width:600px){ .screen{ padding-top:66px; } .topbar{ padding-top:66px; } }
h1,h2,h3,.disp{ font-family:var(--display); font-weight:800; font-style:italic; text-transform:uppercase; letter-spacing:-.005em; line-height:.95; margin:0; }
h1{ font-size:56px; } h2{ font-size:34px; } h3{ font-size:21px; letter-spacing:.01em; }
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3,html[lang="ar"] .disp,html[lang="ar"] .btn.primary,html[lang="ar"] .btn.danger{ font-style:normal; line-height:1.25; letter-spacing:0; }
p{ margin:0 0 10px; } .muted{ color:var(--muted); } .small{ font-size:13px; } .tiny{ font-size:12px; }
.wordmark{ font:800 italic 24px/1 var(--display); text-transform:uppercase; }
.wordmark b{ color:var(--accent-ink); background:var(--accent); padding:1px 7px; border-radius:4px; font-weight:800; }
.row{ display:flex; gap:8px; } .row > *{ flex:1; } .stack{ display:flex; flex-direction:column; gap:10px; }
.divider{ height:1px; background:var(--line); margin:18px 0; }

/* buttons */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; width:100%; min-height:48px; padding:12px 16px; border-radius:14px; border:1px solid var(--line); background:var(--panel2); color:var(--text); font:700 15px/1.2 var(--body); cursor:pointer; text-align:center; transition:transform .08s,filter .15s; }
.btn:active{ transform:scale(.97); }
.btn.primary{ background:var(--accent); color:var(--accent-ink); border-color:transparent; font:800 italic 20px/1 var(--display); text-transform:uppercase; letter-spacing:.02em; box-shadow:var(--glow); }
.btn.danger{ background:var(--red); color:#fff; border-color:transparent; font:800 italic 19px/1 var(--display); text-transform:uppercase; letter-spacing:.02em; box-shadow:0 10px 30px -10px var(--red); }
.btn.gold{ background:var(--accent); color:var(--accent-ink); border-color:transparent; }
.btn.ghost{ background:transparent; }
.btn.sm{ width:auto; min-height:36px; padding:7px 12px; font-size:13px; border-radius:10px; }
.btn.center{ justify-content:center; }
.btn[disabled]{ opacity:.4; cursor:not-allowed; box-shadow:none; }
.iconbtn{ width:42px; height:42px; flex-shrink:0; border-radius:50%; border:1px solid var(--line2); background:var(--panel2); color:var(--text); display:grid; place-items:center; font-size:17px; cursor:pointer; }

/* chips / pills */
.chip{ display:inline-flex; align-items:center; gap:5px; height:30px; padding:0 11px; border-radius:999px; background:var(--panel2); border:1px solid var(--line); font-size:13px; font-weight:700; white-space:nowrap; }
.pill{ display:inline-flex; align-items:center; gap:5px; height:28px; padding:0 10px; border-radius:999px; background:color-mix(in srgb,var(--panel3) 80%,transparent); color:var(--text); font-size:12.5px; font-weight:600; white-space:nowrap; }
.pills{ display:inline-flex; gap:2px; padding:3px; border-radius:999px; background:var(--panel); border:1px solid var(--line); }
.pills button{ border:0; background:transparent; color:var(--muted); font:700 13px var(--body); padding:6px 12px; border-radius:999px; cursor:pointer; }
.pills button.on{ background:var(--text); color:var(--bg); }

/* cards */
.card{ background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:16px; box-shadow:var(--lift); }
.card.flat{ box-shadow:none; }
.stat{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); }
.stat:last-child{ border-bottom:none; }
.stat b{ font:800 italic 22px/1 var(--display); }
.bar{ height:8px; background:var(--panel3); border-radius:99px; overflow:hidden; } .bar i{ display:block; height:100%; background:var(--accent); border-radius:99px; }
.tabs{ display:flex; gap:4px; padding:4px; background:var(--panel); border:1px solid var(--line); border-radius:14px; margin:0 0 12px; }
.tabs button{ flex:1; border:0; background:transparent; color:var(--muted); padding:10px 6px; border-radius:10px; font:700 14px var(--body); cursor:pointer; }
.tabs button.on{ background:var(--panel3); color:var(--text); }

/* ===== HOME ===== */
.homebar{ display:flex; justify-content:space-between; align-items:center; }
.hero{ padding:22px 2px 16px; }
.livebug{ display:inline-flex; align-items:center; gap:8px; height:28px; padding:0 11px 0 9px; border-radius:6px; background:var(--red); color:#fff; font:800 italic 14px/1 var(--display); letter-spacing:.08em; text-transform:uppercase; }
html[lang="ar"] .livebug{ font-style:normal; letter-spacing:0; }
.livebug i{ width:8px; height:8px; border-radius:50%; background:#fff; animation:blip 1.2s infinite; }
@keyframes blip{ 50%{ opacity:.2; } }
.logo{ display:flex; align-items:flex-end; gap:10px; margin-top:14px; font:800 italic clamp(54px,17vw,88px)/.8 "Barlow Condensed",Impact,sans-serif; text-transform:uppercase; letter-spacing:-.02em; direction:ltr; }
.logo span,.logo b{ white-space:nowrap; } .logo b{ font-weight:800; background:var(--accent); color:var(--accent-ink); padding:10px 22px 4px 16px; clip-path:polygon(7% 0,100% 0,93% 100%,0 100%); box-shadow:var(--glow); }
.tagline{ font-size:18px; line-height:1.35; color:var(--muted); margin-top:16px; max-width:30ch; }
.nstack{ position:relative; height:96px; margin:4px 0 18px; }
.notif{ position:absolute; inset-inline:0; top:0; display:flex; gap:12px; align-items:center; min-height:68px; padding:12px 14px; border-radius:18px; background:var(--panel2); border:1px solid var(--line2); box-shadow:0 16px 30px -16px rgba(0,0,0,.8); transition:transform .55s cubic-bezier(.2,.9,.3,1),filter .55s; transform-origin:50% 0; }
.notif .ic{ width:40px; height:40px; border-radius:12px; background:var(--panel3); display:grid; place-items:center; font-size:22px; flex-shrink:0; }
.notif .tx{ flex:1; min-width:0; }
.notif b{ display:flex; justify-content:space-between; gap:8px; font-size:12px; color:var(--muted); font-weight:700; }
.notif b em{ font-style:normal; font-weight:500; color:var(--dim); }
.notif .m{ display:block; font-size:14.5px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.notif.p0{ z-index:3; transform:none; }
.notif.p1{ z-index:2; transform:translateY(13px) scale(.95); filter:brightness(.72); }
.notif.p2{ z-index:1; transform:translateY(26px) scale(.9); filter:brightness(.5); }
.resume{ display:flex; align-items:center; gap:10px; width:100%; padding:14px 16px; margin-bottom:10px; border-radius:16px; border:1px solid color-mix(in srgb,var(--accent) 60%,var(--line)); background:color-mix(in srgb,var(--accent) 12%,var(--panel)); color:var(--text); font:700 15px var(--body); cursor:pointer; text-align:start; }
.resume .dot{ width:10px; height:10px; border-radius:50%; background:var(--accent); box-shadow:0 0 10px var(--accent); animation:blip 1.2s infinite; flex-shrink:0; }
.tile{ position:relative; display:block; width:100%; text-align:start; border:1px solid var(--line); border-radius:22px; padding:18px; background:var(--panel); color:var(--text); cursor:pointer; overflow:hidden; box-shadow:var(--lift); transition:transform .1s; margin-bottom:10px; }
.tile:active{ transform:scale(.985); }
.tile.daily{ background:radial-gradient(110% 90% at 100% 0%,color-mix(in srgb,var(--accent) 24%,transparent),transparent 55%),linear-gradient(160deg,var(--panel2),var(--panel)); border-color:color-mix(in srgb,var(--accent) 45%,var(--line)); }
.tile .num{ position:absolute; inset-inline-end:14px; bottom:-30px; font:800 italic 140px/1 "Barlow Condensed",Impact,sans-serif; color:var(--text); opacity:.07; pointer-events:none; }
.tile .t-title{ display:block; position:relative; font:800 italic 34px/.95 var(--display); text-transform:uppercase; }
html[lang="ar"] .tile .t-title{ font-style:normal; line-height:1.25; }
.tile .t-sub{ display:block; position:relative; color:var(--muted); margin-top:8px; font-size:15px; max-width:34ch; }
.tile .t-foot{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:16px; position:relative; }
.tile .meta{ display:flex; flex-wrap:wrap; gap:6px; }
.tile .cta{ display:inline-flex; align-items:center; justify-content:center; min-width:104px; height:48px; padding:0 20px; border-radius:13px; background:var(--accent); color:var(--accent-ink); font:800 italic 21px/1 var(--display); text-transform:uppercase; box-shadow:var(--glow); flex-shrink:0; }
html[lang="ar"] .tile .cta{ font-style:normal; }
.tile .cta.done{ background:var(--panel3); color:var(--muted); box-shadow:none; }
.tile .donerow{ display:block; font-size:24px; letter-spacing:2px; margin-top:10px; position:relative; }
.ctop{ display:flex; align-items:center; gap:14px; }
.ctop .cinfo{ flex:1; min-width:0; }
.ctop .chev{ font-size:28px; color:var(--muted); } [dir="rtl"] .ctop .chev{ transform:scaleX(-1); }
.ring{ --p:0; width:58px; height:58px; border-radius:50%; background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--panel3) 0); display:grid; place-items:center; flex-shrink:0; }
.ring b{ width:46px; height:46px; border-radius:50%; background:var(--panel); display:grid; place-items:center; font:800 italic 24px/1 "Barlow Condensed",Impact,sans-serif; }
.quick{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.quick button{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; min-height:84px; padding:12px 6px; border-radius:16px; border:1px solid var(--line); background:var(--panel); color:var(--text); font:700 13px/1.2 var(--body); cursor:pointer; text-align:center; }
.quick button span{ font-size:24px; }
.instant .reveal,.instant .tierpop,.instant .stamp{ animation:none !important; opacity:1 !important; }
.archlink{ display:flex; align-items:center; justify-content:space-between; width:100%; margin:-2px 0 12px; padding:13px 16px; border-radius:14px; border:1px solid var(--line); background:var(--panel); color:var(--text); font:700 14.5px var(--body); cursor:pointer; text-align:start; }
.archlink .chev{ color:var(--muted); font-size:20px; } [dir="rtl"] .archlink .chev,[dir="rtl"] .archrow .chev{ transform:scaleX(-1); }
.archstats{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
.archstats div{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px 6px; text-align:center; display:flex; flex-direction:column; gap:4px; }
.archstats b{ font:800 italic 24px/1 "Barlow Condensed",Impact,sans-serif; } .archstats span{ font-size:11.5px; color:var(--muted); font-weight:600; }
.archrow{ display:flex; align-items:center; gap:12px; width:100%; padding:12px 14px; border-radius:16px; border:1px solid var(--line); background:var(--panel); color:var(--text); cursor:pointer; text-align:start; box-shadow:var(--lift); }
.archrow:active{ transform:scale(.985); }
.archrow .an{ font:800 italic 22px/1 "Barlow Condensed",Impact,sans-serif; color:var(--muted); min-width:38px; }
.archrow .ai{ flex:1; min-width:0; display:flex; flex-direction:column; gap:4px; } .archrow .ai b{ font-size:14px; } .archrow .ar{ font-size:15px; letter-spacing:1px; white-space:nowrap; overflow:hidden; }
.archrow .at{ display:flex; flex-direction:column; align-items:flex-end; gap:4px; font-size:12px; color:var(--muted); } .archrow .chev{ color:var(--muted); font-size:22px; }
.tierchip{ font:800 italic 13px/1 var(--display); text-transform:uppercase; padding:4px 7px; border-radius:6px; background:var(--panel3); color:var(--text); white-space:nowrap; } .tierchip.t1{ background:var(--accent); color:var(--accent-ink); } .tierchip.clown{ background:var(--red); color:#fff; }
html[lang="ar"] .tierchip{ font-style:normal; }
.studiolink{ display:inline-flex; align-items:center; gap:6px; height:34px; padding:0 12px; border-radius:999px; border:1px solid var(--line); background:var(--panel); color:var(--text); font:700 13px var(--body); text-decoration:none; }
.foot{ text-align:center; color:var(--dim); font-size:12px; padding:22px 12px 0; }

/* ===== GAME ===== */
.gamehead{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
.t-mode{ display:block; font-size:13px; color:var(--muted); font-weight:700; margin-bottom:4px; }
.dayttl{ font-size:46px; } .dayttl.dd{ color:var(--red); }
.daytrack{ display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin:14px 0; }
.daytrack i{ height:6px; border-radius:99px; background:var(--panel3); }
.daytrack i.past{ background:var(--muted); }
.daytrack i.now{ background:var(--accent); box-shadow:0 0 12px var(--accent); }
.daytrack i.dd{ background:color-mix(in srgb,var(--red) 40%,var(--panel3)); }
.daytrack i.dd.now{ background:var(--red); box-shadow:0 0 12px var(--red); }
.ticker{ margin:0 -16px 14px; overflow:hidden; white-space:nowrap; background:var(--accent); color:var(--accent-ink); font:700 13px var(--body); padding:8px 0; }
.ticker.dd{ background:var(--red); color:#fff; }
.ticker .track{ display:inline-block; padding-inline-start:100%; animation:ticker 30s linear infinite; }
[dir="rtl"] .ticker .track{ animation-name:tickerRtl; }
.ticker b{ background:var(--accent-ink); color:var(--accent); padding:2px 7px; border-radius:4px; margin-inline-end:8px; font:800 italic 13px var(--display); letter-spacing:.05em; }
.ticker.dd b{ background:#fff; color:var(--red); }
@keyframes ticker{ to{ transform:translateX(-100%); } } @keyframes tickerRtl{ to{ transform:translateX(100%); } }
.saga{ display:flex; align-items:center; gap:12px; width:100%; text-align:start; padding:12px; border-radius:18px; border:1px solid var(--line); background:var(--panel); color:var(--text); cursor:pointer; box-shadow:var(--lift); transition:transform .08s; }
.saga:active{ transform:scale(.985); }
.saga .who{ flex:1; min-width:0; }
.saga .who b{ display:block; font:800 italic 21px/1.05 var(--display); text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
html[lang="ar"] .saga .who b{ font-style:normal; line-height:1.4; }
.route{ display:flex; flex-wrap:wrap; align-items:center; gap:2px 6px; font-size:13px; color:var(--muted); margin-top:3px; }
.route i{ width:10px; height:10px; border-radius:3px; flex-shrink:0; box-shadow:0 0 0 1px rgba(255,255,255,.25); }
.route .to{ color:var(--text); font-weight:700; overflow:hidden; text-overflow:ellipsis; }

function relAdj(base){ if(!isCareer()) return base; return Math.min(0.97,Math.max(0.1,base+(save.career.rep-50)/500)); }
function buildBoard(seed){
 const rng=new RNG(seed);
 const picks=rng.shuffle(PLAYERS.slice()).slice(0,8);
 const sagas=picks.map((p,i)=>{
  const club=clubByName(p.club);
  const dest=rng.pick(CLUBS.filter(c=>c.name!==club.name && c.tier<=p.tier+1));
  const hijack=rng.pick(CLUBS.filter(c=>c.name!==club.name&&c.name!==dest.name&&Math.abs(c.tier-dest.tier)<=1));
  const r=rng.next(); const truth=r<0.40?'DONE':r<0.65?'OFF':r<0.85?'HIJACK':'FAKE';
  const s={id:i,player:p,club,dest,hijack,truth,events:[],clues:[],rivalPosts:[],call:null};
  s.events=EVENT_DAYS[truth].map((day,idx)=>({day,idx})).filter(()=>rng.chance(0.6));
  return s;
 });
 RIVALS.forEach(rv=>{ sagas.forEach(s=>{ if(rng.chance(0.5)){ const day=rv.dmin+rng.int(rv.dmax-rv.dmin+1); const correct=rng.chance(rv.rel); const claim=correct?s.truth:rng.pick(OUTCOMES.filter(o=>o!==s.truth)); s.rivalPosts.push({rival:rv.key,day,claim,correct}); } }); });
 return {rng,sagas};
}
function newGame(mode,seed){
 const {rng,sagas}=buildBoard(seed);
 game={v:2,mode,seed,rngState:rng.state,day:1,actions:0,feed:[],sagas,tab:'sagas',result:null,timer:60,followers:mode==='career'?(save.career.followers||1200):1000+rng.int(400)};
 game.actions=baseActions();
 game.feed.push({day:1,type:'sys',k:'sys.open'});
 sagas.forEach(s=>game.feed.push({day:1,type:'event',sagaId:s.id,k:'sys.report'}));
 saveGame();
}
const TIER_KEYS={1:'t1',2:'t2',3:'t3',4:'t4',5:'t5',9:'clown'};
const ARCHIVE_MAX=120;
function tierOf(n){ return {n,key:TIER_KEYS[n]||'t5'}; }
function archiveDaily(k,res){
 const d=save.daily; if(!d.archive) d.archive={};
 d.archive[k]={num:dailyNumber(),followers:game.followers,result:JSON.parse(JSON.stringify(res)),
  sagas:game.sagas.map(s=>({p:s.player.name,c:s.club.name,d:s.dest.name,h:s.hijack.name,truth:s.truth,call:s.call,clues:s.clues.map(c=>({source:c.source,out:c.out,truthful:c.truthful,day:c.day,v:c.v}))}))};
 Object.keys(d.archive).sort().reverse().slice(ARCHIVE_MAX).forEach(x=>delete d.archive[x]);
 if(d.results) delete d.results[k];
}

 return {per,total:h.score,tier:tierOf(h.tier),exclusives:per.filter(x=>x.exclusive).length,wrongs:per.filter(x=>x.called&&!x.correct).length,corrects:per.filter(x=>x.correct).length,fDelta:null,newBadges:[],newCatch:[]};
}
function openDaily(k){
 const d=save.daily, h=d.history[k]; if(!h) return false;
 const a=d.archive&&d.archive[k]; let sagas, result, followers=null;
 if(a){
  sagas=a.sagas.map((x,i)=>({id:i,player:PLAYERS.find(p=>p.name===x.p),club:clubByName(x.c),dest:clubByName(x.d),hijack:clubByName(x.h),truth:x.truth,call:x.call,clues:x.clues||[],rivalPosts:[],events:[]}));

 }

 game={mode:'daily',archived:true,dateKey:k,num:h.num||a&&a.num,seed:'daily-'+k,sagas,result,followers};

}

function clueWho(cl){ if(cl.source==='paid') return t('sheet.paid'); if(cl.source==='tipoff') return t('sheet.tip'); return SOURCES[cl.source].ic+' '+t('src.'+cl.source+'.name'); }
function eventText(s,e){ return fill(tt('evt')[s.truth][e.idx],ctxOf(s)); }
function rivalText(s,rp){ const ri=RIVALS.findIndex(r=>r.key===rp.rival); const rv=RIVALS[ri]; return fill(pickVar(tt('rline')[rp.claim][rv.style],s.id+ri*3),ctxOf(s)); }
function feedText(f){
 if(f.k==='sys.report'||f.k==='sys.open'||f.k==='sys.dd') return f.sagaId!=null?t(f.k,ctxOf(game.sagas[f.sagaId])):t(f.k);
 if(f.k) return t(f.k,Object.assign({},f.ctx||{},f.sagaId!=null?ctxOf(game.sagas[f.sagaId]):{}));
 if(f.type==='rival'&&f.claim) return rivalText(game.sagas[f.sagaId],{rival:f.rival,claim:f.claim});
 if(f.type==='event'&&f.idx!=null) return eventText(game.sagas[f.sagaId],{idx:f.idx});

function officialText(s){ return fill(pickVar(tt('official')[s.truth],s.id),ctxOf(s)); }
function getPlayerType(followers){
 if(followers<400) return {key:'nobody',mult:1.0};
 if(followers<1500) return {key:'rising',mult:1.1};
 if(followers<4000) return {key:'celebrity',mult:1.2};
 return {key:'superstar',mult:1.25};
}
function applyScoreMultiplier(baseScore,isCareerMode){
 if(!isCareerMode) return baseScore;
 const playerType=getPlayerType(save.career.followers||1200);
 return Math.round(baseScore*playerType.mult);
}
function tierFor(score){ if(score<0) return {n:9,key:'clown'}; if(score>=300) return {n:1,key:'t1'}; if(score>=200) return {n:2,key:'t2'}; if(score>=110) return {n:3,key:'t3'}; if(score>=45) return {n:4,key:'t4'}; return {n:5,key:'t5'}; }
function tierName(tr){ return t('tier.'+tr.key); }

// ---------- actions ----------
function contactSource(sagaId,key,opts){
 const s=game.sagas[sagaId]; const src=SOURCES[key]; const r=rng();
 let truthful, out=s.truth, paid=!!(opts&&opts.paid);
 if(paid){ truthful=true; }
 else{
  truthful=r.chance(relAdj(src.rel));
  if(!truthful){ const wrong=OUTCOMES.filter(o=>o!==s.truth); out=(src.bias&&wrong.includes(src.bias)&&r.chance(0.7))?src.bias:r.pick(wrong); }
  game.actions-=src.cost||1;
  if(isCareer()){ const st=save.career.sources[key]||(save.career.sources[key]={n:0,ok:0}); st.n++; if(truthful) st.ok++; if(key==='barber') save.career.barber++; }
 }
 s.clues.push({source:paid?'paid':key,out,truthful,day:game.day,v:Math.floor(Math.random()*999),revealAt:Date.now()+2100+Math.floor(Math.random()*500)});
 commitRng(r); saveGame();
}
function endDay(){
 if(game.day>=7) return;
 game.day++; game.actions=baseActions(); game.adActionUsed=false;
 game.sagas.forEach(s=>{
  s.events.filter(e=>e.day===game.day).forEach(e=>game.feed.push({day:game.day,type:'event',sagaId:s.id,idx:e.idx}));
  s.rivalPosts.filter(rp=>rp.day===game.day).forEach(rp=>game.feed.push({day:game.day,type:'rival',sagaId:s.id,rival:rp.rival,claim:rp.claim}));
 });
 if(game.day===7){ game.actions=2; game.timer=60; game.feed.push({day:7,type:'sys',k:'sys.dd'}); }
 else game.feed.push({day:game.day,type:'sys',k:'sys.day',ctx:{d:game.day}});
 saveGame();
}
function publishCall(sagaId,outcome,conf){
 const s=game.sagas[sagaId]; if(s.call) return 0;
 s.call={outcome,conf,day:game.day,uturn:!!s.uturns};
 const r=rng(); const gain=Math.round((15+r.int(40))*({low:1,med:1.6,high:2.4}[conf])); game.followers+=gain; commitRng(r);
 game.feed.push({day:game.day,type:'you',sagaId,outcome,conf});
 saveGame(); return gain;
}
function uturnCall(sagaId){
 const s=game.sagas[sagaId]; if(!s.call) return 0;
 s.uturns=(s.uturns||0)+1;
 game.feed.forEach(f=>{ if(f.type==='you'&&f.sagaId===sagaId&&!f.deleted) f.deleted=true; });
 const r=rng(); const loss=Math.max(20,Math.round(game.followers*(0.04+r.next()*0.04))); game.followers=Math.max(100,game.followers-loss); commitRng(r);
 game.feed.push({day:game.day,type:'sys',k:'sys.deleted',sagaId,ctx:{n:loss}});
 game.feed.push({day:game.day,type:'rival',rival:'tabloid',sagaId,k:'rivalmsg.uturn'});
 s.call=null; if(isCareer()&&!save.career.badges.includes('flip')) save.career.badges.push('flip');
 saveGame(); return loss;
}
function resolveWindow(){
 if(game.result) return;
 const r=rng(); let total=0, exclusives=0, wrongs=0, corrects=0, highWrong=false, ddCorrect=false;
 const usedR=new Set(), usedP=new Set(), usedS=new Set(); const deck=save.replyDeck||(save.replyDeck={r:[],p:[]});
 const draw=(k,n,used)=>{ for(let q=0;q<4;q++){ if(!deck[k]||!deck[k].length) deck[k]=shuffleRand([...Array(n).keys()]).filter(i=>!used.has(i)); const i=deck[k].pop(); if(i!=null&&!used.has(i)){ used.add(i); return i; } } for(let i=0;i<n;i++) if(!used.has(i)){ used.add(i); return i; } return 0; };
 const hdeck=shuffleRand([...Array(HANDLES.length).keys()]);
 const per=game.sagas.map(s=>{
  const out={sagaId:s.id,called:!!s.call,correct:false,exclusive:false,uturn:false,pts:0,replies:[],emoji:'⚪'};
  if(s.call){
   out.uturn=!!s.call.uturn; out.correct=s.call.outcome===s.truth;
   if(out.correct){
    corrects++; out.pts=PTS[s.call.conf][0]+(7-s.call.day)*3;
    const firstRival=s.rivalPosts.filter(rp=>rp.correct).map(rp=>rp.day).sort((a,b)=>a-b)[0];
    out.exclusive=!out.uturn&&((firstRival==null)||(s.call.day<firstRival));
    if(out.uturn) out.pts=Math.round(PTS[s.call.conf][0]*0.5);
    if(out.exclusive){ out.pts+=15; exclusives++; }
    if(s.call.day===7) ddCorrect=true; out.emoji=out.exclusive?'🔵':'🟢';
    out.replies=[draw('p',PRAISE_N,usedP),draw('p',PRAISE_N,usedP)];
   }else{ wrongs++; out.pts=PTS[s.call.conf][1]-(out.uturn?10:0); if(s.call.conf==='high') highWrong=true; out.emoji='🔴'; out.replies=[draw('r',ROAST_N,usedR),draw('r',ROAST_N,usedR)]; }
   total+=out.pts;
   out.handles=[hdeck.pop()||0,hdeck.pop()||0];
   const cl=[...s.clues].reverse().find(c=>c.source!=='paid'&&c.source!=='tipoff');
   if(cl){ const cs=cl.truthful?(out.correct?'toldYou':'ignored'):(out.correct?'dodged':'lied'); const k0=cl.source+'.'+cs+'.'; let v=Math.floor(Math.random()*2); if(usedS.has(k0+v)) v=1-v; if(!usedS.has(k0+v)){ usedS.add(k0+v); out.srcReply={src:cl.source,cs,v}; } }
  }
  return out;
 });
 let fDelta=0; per.forEach(x=>{ if(!x.called) return; if(x.correct){ fDelta+=200+r.int(400)+(x.exclusive?800:0); } else { fDelta-=120+r.int(300); } });
 game.followers=Math.max(100,game.followers+fDelta); commitRng(r);
 const multipliedTotal=applyScoreMultiplier(total,game.mode==='career');
 const tier=tierFor(multipliedTotal);
 const res={per,total:multipliedTotal,baseTotal:total,tier,exclusives,wrongs,corrects,newBadges:[],newCatch:[],xpGain:0,creditGain:0,repDelta:0,levelUp:null,fDelta};
 if(game.mode==='daily'){
  const k=todayKey(); const d=save.daily;
  if(!d.history[k]){ const y=new Date(); y.setDate(y.getDate()-1); const yk=y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0');
   d.streak=(d.lastDate===yk)?d.streak+1:1; d.lastDate=k; d.history[k]={score:total,tier:tier.n,row:per.map(x=>x.emoji).join(''),num:dailyNumber()}; }
  archiveDaily(k,res);
 }else if(game.mode==='career'){
  const c=save.career; const before=levelInfo(c.xp); c.followers=game.followers;
  res.xpGain=Math.max(0,multipliedTotal)+20; c.xp+=res.xpGain;
  res.creditGain=Math.round((10+Math.max(0,multipliedTotal)/2)*(c.rep>=70?1.25:1)); c.credits+=res.creditGain;
  res.repDelta=corrects*3-wrongs*4; c.rep=Math.max(0,Math.min(100,c.rep+res.repDelta));
  c.windows++; c.exclusives+=exclusives; c.wrong+=wrongs; c.correct+=corrects; c.bestTier=Math.min(c.bestTier,tier.n);
  c.history.unshift({when:todayKey(),score:multipliedTotal,tier:tier.n,row:per.map(x=>x.emoji).join('')}); c.history=c.history.slice(0,20);
  const after=levelInfo(c.xp); if(after.n>before.n) res.levelUp=after;
  const give=(k)=>{ if(!c.badges.includes(k)){ c.badges.push(k); res.newBadges.push(k);} };
  give('first'); if(wrongs===0&&corrects>0) give('clean'); if(ddCorrect) give('ddhero'); if(c.exclusives>=5) give('scoop'); if(tier.n===1) give('tier1');
  if(highWrong) give('fumble'); if(wrongs>=3) give('ratio'); if(c.barber>=10) give('barber'); if(c.wrong>=10) give('wrong10');
  const cg=(k)=>{ if(!c.catch.includes(k)){ c.catch.push(k); res.newCatch.push(k);} };
  if(after.n>=2) cg('sources'); if(c.windows>=3) cg('allegedly'); if(c.barber>=10) cg('barber'); if(c.wrong>=10) cg('myman'); if(c.exclusives>=5) cg('scoop'); if(c.rep>=80) cg('trust'); if(tier.n===1) cg('tier1');
 }
 game.result=res; save.inProgress=null; persist();
}

function coachHtml(k){
 if(!game||coachDone(k)) return '';
 const s=currentSaga!=null?game.sagas[currentSaga]:null;
 const show={ c1:screen==='window'&&game.tab==='sagas'&&!game.sagas.some(x=>x.clues.length||x.call),
              c2:!!s&&s.clues.length===0&&game.actions>0,
              c3:!!s&&s.clues.length>0&&!s.call,
              c4:screen==='window'&&game.day<7&&(game.actions===0||game.sagas.some(x=>x.call)),

function beep(kind){

 try{ audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)(); const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.connect(g); g.connect(audioCtx.destination); const tm=audioCtx.currentTime;
  const P={pop:[[600,0,'sine'],[900,.06]],ding:[[880,0,'sine'],[1320,.08],[1760,.16]],buzz:[[160,0,'sawtooth'],[110,.2]],tick:[[1000,0,'square']],whoosh:[[300,0,'triangle'],[1200,.12]]}[kind]||[[500,0,'sine']];
  o.type=P[0][2]; P.forEach(([f,dt])=>o.frequency.setValueAtTime(f,tm+dt)); const dur=kind==='buzz'?.28:kind==='tick'?.05:kind==='ding'?.32:.14;
  g.gain.setValueAtTime(kind==='tick'?.05:.12,tm); g.gain.exponentialRampToValueAtTime(.001,tm+dur); o.start(tm); o.stop(tm+dur); }catch(e){}

// ----- saga sheet -----
function openSaga(id){ draft={outcome:null,conf:null}; dismissCoach('c1'); renderSagaModal(id); }
function renderSagaModal(id){
 currentSaga=id; clearTimeout(pendingTimer);
 const s=game.sagas[id]; const ctx=ctxOf(s); const career=isCareer(); const now=Date.now();
 const pending=s.clues.some(cl=>cl.revealAt&&cl.revealAt>now);
 const asks=tt('ask');
 const items=[
  ...s.clues.map((cl,i)=>({k:'clue',cl,day:cl.day,ask:fill(asks[(id+i)%asks.length],ctx),wait:cl.revealAt&&cl.revealAt>now,seq:i})),
  ...game.feed.filter(f=>f.sagaId===id&&f.type==='rival').map(f=>({k:'rival',rv:RIVALS.find(r=>r.key===f.rival),day:f.day,text:feedText(f),seq:-1})),
  ...game.feed.filter(f=>f.sagaId===id&&f.type==='event'&&f.day>1).map(f=>({k:'evt',day:f.day,text:feedText(f),seq:-1}))
 ].sort((a,b)=>a.day-b.day||a.seq-b.seq);

  if(it.k==='rival') return `<div class="bub them rival"><span class="who">${it.rv.ic} ${esc(t('rival.'+it.rv.key))} · ${esc(t('win.dayN',{d:it.day}))}</span>${esc(it.text)}</div>`;
  if(it.k==='evt') return `<div class="bub them evt"><span class="who">📡 ${esc(t('win.wire'))} · ${esc(t('win.dayN',{d:it.day}))}</span>${esc(it.text)}</div>`;
  const cl=it.cl; const who=clueWho(cl); const me=cl.source==='tipoff'?'':`<div class="bub me">${esc(it.ask)}</div>`;
  if(it.wait) return me+`<div class="bub them"><span class="who">${esc(who)}</span><span class="typing"><i></i><i></i><i></i></span></div>`;
  let extra='';
  if(cl.source==='airport'){ const to=(cl.out==='HIJACK')?cityName(s.hijack):cityName(s.dest); extra=`<div class="jetline"><span>${esc(cityName(s.club))}</span><div class="track"><i>✈️</i></div><span>${esc(to)}</span></div>`; }
  if(cl.source==='physio') extra=ecgSVG();
  return me+`<div class="bub them ${cl.source==='paid'||cl.source==='tipoff'?'paid':''}"><span class="who">${esc(who)} · ${esc(t('win.dayN',{d:cl.day}))}</span>${esc(clueText(s,cl))}${extra}</div>`;
 }).join('');
 const srcHtml=Object.entries(SOURCES).map(([k,src])=>{ const locked=career&&src.lock&&!save.career.equip.includes(src.lock); const dis=game.actions<(src.cost||1)||locked||pending;

 const lv=levelInfo(save.career.xp).n;

   <div class="callnote">${esc(t('sheet.lockedNote'))}</div><button class="btn ghost center" style="margin-top:8px" data-act="uturnAsk" data-id="${id}">${esc(t('sheet.change'))}</button>`;

  ${transferGraphic(s)}
  <h3>${esc(t('sheet.dms'))}</h3>${coachHtml('c2')}<div class="chat">${chat||`<div class="bub them"><span class="who">📡 ${esc(t('win.wire'))}</span>${esc(t('sheet.dmsEmpty'))}</div>`}</div>
  <h3>${esc(t('sheet.contact'))} <span class="muted small" style="font-family:var(--body);font-weight:500">${esc(t('sheet.left',{n:game.actions}))}</span></h3><div class="srcgrid">${srcHtml}</div>
  ${boostHtml}
  <div class="divider"></div><h3>${esc(t('sheet.yourCall'))}</h3>${coachHtml('c3')}<div style="margin-top:8px">${callHtml}</div>`,pName(s.player));
 const m=$('modalRoot').querySelector('.modal'); if(m&&scrollY) m.scrollTop=scrollY;
 if(pending){ const wait=Math.max(50,Math.min(...s.clues.filter(cl=>cl.revealAt>now).map(cl=>cl.revealAt-now))+30); pendingTimer=setTimeout(()=>{ if(currentSaga===id&&$('modalRoot').innerHTML){ beep('pop'); renderSagaModal(id); } },wait); }

function runBoost(id,key){
 const s=game.sagas[id]; const b=BOOSTS.find(x=>x.key===key); const c=save.career; if(c.credits<b.cost) return; c.credits-=b.cost;
 if(key==='burner'){ game.actions++; beep('pop'); toast(t('toast.plus1')); saveGame(); syncWindow(); renderSagaModal(id); return; }
 if(key==='tipoff'){ s.clues.push({source:'tipoff',out:s.truth,truthful:true,day:game.day,revealAt:Date.now()+2000}); saveGame(); closeModalQuiet(); contactOverlay('tipoff',()=>renderSagaModal(id)); return; }
 if(key==='bribe'){ const r=rng(); const ok=r.chance(0.75); commitRng(r);
  if(ok){ contactSource(id,'leak',{paid:true}); saveGame(); closeModalQuiet(); contactOverlay('paid',()=>renderSagaModal(id)); return; }
  c.rep=Math.max(0,c.rep-8); if(!c.badges.includes('blocked')) c.badges.push('blocked'); game.feed.push({day:game.day,type:'rival',rival:'tabloid',sagaId:id,k:'rivalmsg.bribe'}); beep('buzz'); buzzPhone(200); shakeScreen(); toast(t('toast.leaked')); saveGame(); renderSagaModal(id); }
}

function afterResults(){
 const r=game.result; if(!r) return; if(r._played){ const el=$('scoreNum'); if(el) el.textContent=r.total; return; }
 r._played=true; const step=550;
 r.per.forEach((x,i)=>{ setTimeout(()=>{ if(screen!=='results'||!x.called) return; if(x.correct) beep(x.exclusive?'ding':'pop'); else { beep('buzz'); buzzPhone(120); shakeScreen(); } },i*step+350); });
 setTimeout(()=>{ if(screen!=='results') return; const el=$('scoreNum'); if(el) countUp(el,r.total,900); if(r.tier.n<=2){ confetti(); beep('ding'); } else if(r.tier.n===9){ shakeScreen(); beep('buzz'); buzzPhone([100,60,100]); } },r.per.length*step+400);
}

 if(a==='closeModal'){ if(e.target===el) closeModal(); return; }

 if(a==='importSaveUI'){ const code=prompt(t('prod.pasteCode')); if(code==null) return; if(importSave(code)){ toast(t('prod.codeLoaded')); closeModalQuiet(); applyTheme(); go('home'); } else toast(t('prod.codeBad')); return; }
 if(a==='nativeShare'){ const tx=$('shareText').textContent; if(navigator.share){ navigator.share({text:tx}).then(()=>Analytics.track('share',{method:'native',content_type:'result_card'}),()=>{}); } return; }
 if(a==='setLang'){ setLang(v); toast(t('toast.lang')); if($('modalRoot').innerHTML&&screen!=='window') renderSettings(); else if($('modalRoot').innerHTML&&currentSaga!=null&&screen==='window'){ render(); renderSagaModal(currentSaga); } else render(); return; }
 if(a==='setTheme'){ save.settings.theme=v; persist(); applyTheme(); renderSettings(); return; }
 if(a==='setSound'){ save.settings.sound=v==='1'; persist(); if(save.settings.sound) beep('pop'); renderSettings(); return; }
 if(a==='replayTut'){ save.tutorial={intro:false,steps:{}}; persist(); closeModal(); showIntro(choice=>{ save.tutorial.intro=true; persist(); if(choice==='practice') startMode('practice'); else render(); }); return; }
 if(a==='resetAll'){ if(confirm(t('settings.confirm'))){ const l=lang, pu=save.purchases, co=save.consent; save=freshSave(); save.settings.lang=l; save.purchases=pu; save.consent=co; game=null; persist(); Analytics.track('save_reset',{}); go('home'); } return; }
 if(a==='introNext'){ introStep++; renderIntro(); return; }
 if(a==='introGo'){ closeIntro(); const th=introThen; introThen=null; if(th) th(v); return; }
 if(a==='coachOk'){ dismissCoach(v); if($('modalRoot').innerHTML&&currentSaga!=null) renderSagaModal(currentSaga); else render(); return; }
 if(a==='startDaily'){ maybeIntro('daily'); return; }
 if(a==='archive'){ go('archive'); return; }
 if(a==='openDay'){ openDaily(v); return; }
 if(a==='startCareer'){ maybeIntro('career'); return; }
 if(a==='startPractice'){ maybeIntro('practice'); return; }
 if(a==='openCareer'){ go('career'); return; }
 if(a==='ctab'){ careerTab=v; render(); return; }
 if(a==='resume'){ game=save.inProgress; if(game.mode==='daily'&&game.seed!=='daily-'+todayKey()){ toast(t('toast.expired')); save.inProgress=null; persist(); game=null; render(); return; } go('window'); return; }
 if(a==='tab'){ game.tab=v; render(); return; }
 if(a==='openSaga'){ beep('pop'); openSaga(id); return; }
 if(a==='contact'){ const src=el.dataset.src; if(game.actions<(SOURCES[src].cost||1)||document.querySelector('.big')) return; contactSource(id,src); dismissCoach('c2'); syncWindow(); closeModalQuiet(); contactOverlay(src,()=>{ renderSagaModal(id); }); return; }
 if(a==='pickOutcome'){ draft.outcome=v; beep('pop'); renderSagaModal(currentSaga); const st=$('confStep'); if(st&&st.scrollIntoView) st.scrollIntoView({behavior:'smooth',block:'start'}); return; }
 if(a==='pickConf'){ if(!draft.outcome){ toast(t('toast.pickFirst')); return; } draft.conf=v; beep('whoosh'); const sid=currentSaga; closeModalQuiet(); composeOverlay(sid,draft.outcome,draft.conf); return; }
 if(a==='publish'){ if(el.disabled) return; postFromCompose(id,el.dataset.o,el.dataset.c); return; }
 if(a==='rewrite'){ const d=document.querySelector('.big.compose'); const sid=currentSaga; dismissBig(d,()=>{ draft.conf=null; renderSagaModal(sid); }); return; }
 if(a==='uturnAsk'){ openModal(`<h2>${esc(t('uturn.title'))}</h2><p class="muted" style="margin-top:8px">${esc(t('uturn.body'))}</p><div class="row" style="margin-top:12px"><button class="btn danger" data-act="uturnGo" data-id="${id}">${esc(t('uturn.del'))}</button><button class="btn center" data-act="openSaga" data-id="${id}">${esc(t('uturn.keep'))}</button></div>`,t('uturn.title')); return; }
 if(a==='uturnGo'){ closeModalQuiet(); uturnOverlay(id,()=>{ draft={outcome:null,conf:null}; render(); renderSagaModal(id); }); return; }
 if(a==='boost'){ runBoost(id,el.dataset.b); return; }
 if(a==='adAction'){ showAd(()=>{ game.actions++; game.adActionUsed=true; saveGame(); toast(t('ad.plus')); render(); }); return; }
 if(a==='endDay'){ endDay(); dismissCoach('c4'); const dd=game.day===7; beep(dd?'buzz':'whoosh'); if(dd) buzzPhone([80,40,80]); splash(dd?t('win.deadline'):t('win.day',{d:game.day}), dd?t('tut.coach.c5'):t('sys.day',{d:game.day}).split('.').slice(1).join('.').trim(), dd); render(); if(dd) startTimer(); return; }
 if(a==='finish'){ finishWindow(); return; }
 if(a==='copyShare'){ const tx=$('shareText').textContent; const done=()=>{ toast(t('toast.copied')); Analytics.track('share',{method:'copy',content_type:'result_card'}); }; if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(tx).then(done,()=>fallbackCopy(tx,done)); else fallbackCopy(tx,done); return; }
 if(a==='buyEquip'){ const eq=EQUIP.find(x=>x.key===v); if(save.career.credits>=eq.cost&&!save.career.equip.includes(v)){ save.career.credits-=eq.cost; save.career.equip.push(v); persist(); Analytics.track('spend_virtual_currency',{value:eq.cost,virtual_currency_name:'credits',item_name:v}); beep('ding'); toast(t('toast.bought',{x:t('equip.'+v+'.name')})); render(); } return; }
 if(a==='setCatch'){ save.settings.catch=v; persist(); beep('pop'); toast(t('toast.catchSet')); render(); return; }
 if(a==='buySkin'){ const sk=SKINS.find(x=>x.key===v); if(save.career.credits>=sk.cost){ save.career.credits-=sk.cost; save.settings.skins.push(v); save.settings.skin=v; persist(); Analytics.track('spend_virtual_currency',{value:sk.cost,virtual_currency_name:'credits',item_name:'skin_'+v}); beep('ding'); toast(t('toast.skin')); render(); } return; }
 if(a==='setSkin'){ save.settings.skin=v; persist(); applyTheme(); if($('modalRoot').innerHTML&&screen!=='window') renderSettings(); else render(); return; }
});
function fallbackCopy(tx,done){ const ta=document.createElement('textarea'); ta.value=tx; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); done(); }catch(e){ toast(t('toast.copyFail')); } ta.remove(); }

const Analytics={
 ready:false,
 init(){ if(this.ready||!CONFIG.GA4_ID) return; if(CONFIG.CONSENT_REQUIRED&&save.consent!=='all') return;
  window.dataLayer=window.dataLayer||[]; window.gtag=window.gtag||function(){ window.dataLayer.push(arguments); };
  gtag('js',new Date()); gtag('config',CONFIG.GA4_ID,{anonymize_ip:true});
  const s=document.createElement('script'); s.async=true; s.src='https://www.googletagmanager.com/gtag/js?id='+encodeURIComponent(CONFIG.GA4_ID); document.head.appendChild(s); this.ready=true; },
 track(name,params){ try{ const pr=Object.assign({app_version:CONFIG.VERSION,lang:lang},params||{}); if(CONFIG.DEBUG) console.log('[tier-one]',name,pr); if(this.ready&&window.gtag) gtag('event',name,pr); }catch(e){} }
};
const Consent={
 needed(){ return !!CONFIG.CONSENT_REQUIRED && !save.consent; },
 allowed(){ return !CONFIG.CONSENT_REQUIRED || save.consent==='all'; },
 set(v){ const prev=save.consent; save.consent=v; persist(); if(v==='all'){ Analytics.init(); Ads.init(); } Analytics.track('consent_update',{choice:v}); closeModalQuiet(); render(); if(prev==='all'&&v!=='all'){ setTimeout(()=>{ try{ location.reload(); }catch(e){} },250); } }
};
function renderConsent(){ const root=$('consentRoot'); if(!root) return; const show=Consent.needed()&&screen==='home';
 root.innerHTML=show?`<div class="consent" role="region" aria-label="${esc(t('prod.cookies'))}"><div class="in"><p>${esc(t('prod.consentText'))}</p><div class="row"><button class="btn primary sm" data-act="consentAll">${esc(t('prod.acceptAll'))}</button><button class="btn sm" data-act="consentEssential">${esc(t('prod.essential'))}</button><button class="btn sm ghost" data-act="legal" data-v="privacy">${esc(t('prod.privacy'))}</button></div></div></div>`:'';
 document.body.classList.toggle('has-consent',show); }
function consentPrefs(){ openModal(`<h2>${esc(t('prod.cookies'))}</h2><p class="muted" style="margin-top:8px">${esc(t('prod.consentText'))}</p><div class="stat"><span>${esc(t('prod.current'))}</span><b>${esc(save.consent==='all'?t('prod.acceptAll'):t('prod.essential'))}</b></div><div class="row" style="margin-top:12px"><button class="btn primary" data-act="consentAll">${esc(t('prod.acceptAll'))}</button><button class="btn center" data-act="consentEssential">${esc(t('prod.essential'))}</button></div><p class="muted tiny" style="margin-top:10px">${esc(t('prod.consentNote'))}</p>`,t('prod.cookies')); }

const Ads={
 loaded:false, h5Ready:false,
 active(){ return !!CONFIG.ADSENSE_CLIENT && Consent.allowed() && !save.purchases.removeAds; },
 init(){ if(this.loaded||!this.active()) return;
  const s=document.createElement('script'); s.async=true; s.crossOrigin='anonymous'; s.src='https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client='+encodeURIComponent(CONFIG.ADSENSE_CLIENT);
  if(CONFIG.REWARDED_ADS==='h5') s.setAttribute('data-ad-frequency-hint','30s');

  if(CONFIG.REWARDED_ADS==='h5'){ window.adsbygoogle=window.adsbygoogle||[]; window.adBreak=window.adConfig=function(o){ window.adsbygoogle.push(o); }; try{ window.adConfig({preloadAdBreaks:'on',sound:save.settings.sound?'on':'off',onReady:()=>{ Ads.h5Ready=true; }}); }catch(e){} } },
 slot(key){ if(save.purchases.removeAds) return ''; const id=(CONFIG.AD_SLOTS||{})[key];
  if(this.active()&&id) return `<div class="ad-wrap"><ins class="adsbygoogle" style="display:block" data-ad-client="${esc(CONFIG.ADSENSE_CLIENT)}" data-ad-slot="${esc(id)}" data-ad-format="auto" data-full-width-responsive="true"></ins></div>`;
  if(CONFIG.SHOW_AD_PLACEHOLDERS&&!CONFIG.ADSENSE_CLIENT) return `<div class="ad-wrap ad-ph"><span>${esc(t('prod.adSpace'))} · ${esc(key)}</span></div>`;
  return ''; },
 push(){ if(!this.active()) return; document.querySelectorAll('ins.adsbygoogle:not([data-t1])').forEach(el=>{ el.setAttribute('data-t1','1'); try{ (window.adsbygoogle=window.adsbygoogle||[]).push({}); Analytics.track('ad_impression',{ad_platform:'adsense',ad_unit_name:el.getAttribute('data-ad-slot')||''}); }catch(e){} }); }
};

const Pay={
 price(pack){ const p=CONFIG.PACKS[pack]; const n=parseFloat(String(p&&p.price||'').replace(/[^0-9.]/g,'')); return isNaN(n)?0:n; },
 name(pack){ return pack==='removeAds'?t('prod.removeAds'):t('career.'+pack); },
 available(pack){ return !!(CONFIG.STRIPE_LINKS&&CONFIG.STRIPE_LINKS[pack]&&CONFIG.PACKS[pack]); },
 deviceId(){ if(!save.purchases.device){ save.purchases.device='t1-'+Math.random().toString(36).slice(2,10)+Date.now().toString(36); persist(); } return save.purchases.device; },
 start(pack){ if(!this.available(pack)) return; const link=CONFIG.STRIPE_LINKS[pack];
  Analytics.track('begin_checkout',{currency:'USD',value:this.price(pack),items:[{item_id:pack,item_name:this.name(pack),price:this.price(pack),quantity:1}]});
  const url=link+(link.indexOf('?')>-1?'&':'?')+'client_reference_id='+encodeURIComponent(this.deviceId()); persist(); setTimeout(()=>{ location.href=url; },120); },
 async onReturn(){ let q; try{ q=new URLSearchParams(location.search); }catch(e){ return; } const pack=q.get('purchase'), sid=q.get('session_id')||''; if(!pack) return;
  try{ history.replaceState(null,'',location.pathname+(location.hash||'')); }catch(e){}
  if(!CONFIG.PACKS[pack]) return; if(sid&&save.purchases.sessions.indexOf(sid)>-1) return;
  let granted=null;
  if(CONFIG.VERIFY_ENDPOINT){ try{ const r=await fetch(CONFIG.VERIFY_ENDPOINT+'?session_id='+encodeURIComponent(sid),{cache:'no-store'}); const j=await r.json(); if(j&&j.ok&&CONFIG.PACKS[j.pack]) granted=j.pack; }catch(e){} }
  else granted=pack;
  if(!granted){ Analytics.track('purchase_unverified',{pack}); openModal(`<h2>${esc(t('prod.hmm'))}</h2><p class="muted" style="margin-top:8px">${esc(t('prod.verifyFail',{e:CONFIG.CONTACT_EMAIL}))}</p><button class="btn primary" style="margin-top:12px" data-act="closeSheet">${esc(t('settings.close'))}</button>`,t('prod.hmm')); return; }
  this.grant(granted,sid); },
 grant(pack,sid){ if(sid){ save.purchases.sessions.push(sid); if(save.purchases.sessions.length>60) save.purchases.sessions=save.purchases.sessions.slice(-60); }
  let msg; if(pack==='removeAds'){ save.purchases.removeAds=true; msg=t('prod.thanksAds'); } else { const n=CONFIG.PACKS[pack].credits; save.career.credits+=n; save.purchases.credits=(save.purchases.credits||0)+n; msg=t('prod.thanksCredits',{n}); }
  persist(); Analytics.track('purchase',{transaction_id:sid||('local-'+Date.now()),currency:'USD',value:this.price(pack),items:[{item_id:pack,item_name:this.name(pack),price:this.price(pack),quantity:1}]});
  try{ beep('ding'); confetti(); }catch(e){}
  openModal(`<h2>${esc(t('prod.thanksTitle'))}</h2><p style="margin-top:8px">${esc(msg)}</p><button class="btn primary" style="margin-top:12px" data-act="closeSheet">${esc(t('settings.close'))}</button>`,t('prod.thanksTitle')); }
};

// ----- save codes (move progress between devices) -----
function b64enc(s){ const u=new TextEncoder().encode(s); let b=''; for(let i=0;i<u.length;i++) b+=String.fromCharCode(u[i]); return btoa(b); }
function b64dec(b){ const bin=atob(b); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return new TextDecoder().decode(u); }
function codeHash(s){ let h=5381; for(let i=0;i<s.length;i++) h=(Math.imul(h,33)^s.charCodeAt(i))>>>0; return h.toString(36); }
function exportSave(){ try{ const b=b64enc(JSON.stringify(save)); return 'T1.'+b+'.'+codeHash(b); }catch(e){ return ''; } }
function importSave(code){ try{ const m=String(code||'').trim().match(/^T1\.([A-Za-z0-9+\/=]+)\.([a-z0-9]+)$/); if(!m||codeHash(m[1])!==m[2]) return false;
 const obj=JSON.parse(b64dec(m[1])); if(!obj||typeof obj!=='object'||!obj.career||!obj.settings) return false;
 const keepConsent=save.consent; let stored=false; try{ localStorage.setItem(SAVE_KEY,JSON.stringify(obj)); stored=true; }catch(e){}
 if(stored) loadSave(); else { save=Object.assign(freshSave(),obj); lang=save.settings.lang||lang; }
 if(!save.consent) save.consent=keepConsent; game=null; stopTimer(); persist(); Analytics.track('save_import',{}); return true; }catch(e){ return false; } }
