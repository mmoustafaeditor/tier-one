<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Tier One — the transfer journalist game. Tap to open.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1224"/>
      <stop offset="1" stop-color="#1F2C4A"/>
    </linearGradient>
    <linearGradient id="stripe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFD23F"/>
      <stop offset="1" stop-color="#FFB020"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="420" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="10" fill="url(#stripe)"/>
  </g>
  <svg x="80" y="90" width="240" height="240" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="t1-t1bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0C1224"/>
      <stop offset="1" stop-color="#070B17"/>
    </linearGradient>
    <pattern id="t1-t1stripes" width="36" height="512" patternUnits="userSpaceOnUse">
      <rect width="18" height="512" fill="#FFFFFF" opacity=".035"/>
    </pattern>
    <clipPath id="t1-t1clip"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#t1-t1clip)">
    <rect width="512" height="512" fill="url(#t1-t1bg)"/>
    <rect width="512" height="512" fill="url(#t1-t1stripes)"/>
  </g>
  <rect x="3" y="3" width="506" height="506" rx="110" fill="none" stroke="#FFFFFF" stroke-opacity=".08" stroke-width="6"/>
  <path d="M130 150 H424 Q438 150 435 164 L396 348 Q393 362 379 362 H86 Q72 362 75 348 L114 164 Q117 150 130 150 Z" fill="#FFD23F"/>
  <text x="258" y="316" text-anchor="middle" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-weight="900" font-style="italic" font-size="176" letter-spacing="-4" fill="#1A1400">T1</text>
  <circle cx="408" cy="98" r="30" fill="#FF3D55"/>
</svg>
  <g font-family="'Arial Narrow','Helvetica Neue',Arial,sans-serif">
    <text x="370" y="118" fill="#FF3D55" font-size="22" font-weight="800" letter-spacing="5">GAME 01 · OUT NOW ON ANDROID</text>
    <text x="366" y="200" fill="#F3F5FA" font-size="92" font-weight="900" letter-spacing="1">TIER ONE</text>
    <text x="370" y="246" fill="#FFD23F" font-size="30" font-weight="700">The football transfer journalist game</text>
    <text x="370" y="290" fill="#8C97B4" font-size="24">Work your sources. Break the deal first. Or get ratio'd trying.</text>
  </g>
  <g transform="translate(370 320)" font-family="'Arial Narrow',Arial,sans-serif" font-weight="800">
    <rect width="270" height="54" rx="27" fill="#FFD23F"/>
    <text x="135" y="36" text-anchor="middle" font-size="24" fill="#1A1400" letter-spacing="2">OPEN THE GAME ▸</text>
  </g>
  <g font-family="Arial,sans-serif" font-size="18" fill="#5F6B8A">
    <text x="1120" y="370" text-anchor="end">EN · ES · AR</text>
  </g>
</svg>
