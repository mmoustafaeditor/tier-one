name: Build Tier One APK
on:
  push:
    paths:
      - 'tier-one/index.html'
      - 'games/tier-one/**'
      - '.github/workflows/build-tier-one.yml'
  pull_request:
    paths:
      - 'tier-one/index.html'
      - 'games/tier-one/**'
      - '.github/workflows/build-tier-one.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/tier-one
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Check the game is bundled
        run: unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/index.html'
      - uses: actions/upload-artifact@v4
        with:
          name: TierOne-apk
          path: games/tier-one/app/build/outputs/apk/debug/app-debug.apk
